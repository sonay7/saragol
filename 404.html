<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صفحه پیدا نشد | ساراگل</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { display: flex; justify-content: center; align-items: center; min-height: 100vh; text-align: center; }
    .error-box { background: var(--bg-card); padding: 40px; border-radius: 20px; border: 1px solid var(--border); max-width: 400px; }
    .error-code { font-size: 5rem; font-weight: bold; color: var(--green); margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="error-box">
    <div class="error-code">404</div>
    <h2>اوه! این صفحه پیدا نشد 🧐</h2>
    <p style="color: var(--text-dim); margin: 15px 0;">به نظر میاد آدرس رو اشتباه زدی یا این صفحه حذف شده.</p>
    <a href="index.html" class="btn btn-green btn-full">برگرد به خونه</a>
  </div>
</body>
</html>
