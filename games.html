<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بازی‌ها | ساراگل</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .game-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 16px; text-align: center; }
    .game-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 20px; }
    .game-tile { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 20px 10px; text-align: center; text-decoration: none; color: var(--text); display: flex; flex-direction: column; align-items: center; gap: 10px; transition: 0.2s; }
    .game-tile:hover { transform: translateY(-3px); border-color: var(--green); }
    .game-icon { font-size: 3rem; }
    .game-name { font-size: 1rem; font-weight: 600; }
  </style>
</head>
<body>

  <header class="header">
    <div class="logo">ساراگل</div>
    <div class="user-area">
      <span class="user-name">—</span>
      <div class="avatar">—</div>
    </div>
  </header>

  <main class="container">
    <h2 style="text-align:center; margin-bottom:20px;">🎮 بازی و سرگرمی</h2>

    <div class="game-card">
      <h3>🧠 معمای روز</h3>
      <p id="riddleQuestion" style="margin: 10px 0; font-size: 0.95rem; min-height: 40px;">در حال بارگذاری...</p>
      <input type="text" id="riddleAnswer" class="input" placeholder="جوابت رو بنویس...">
      <button onclick="checkRiddle()" class="btn btn-blue btn-full" style="margin-top: 10px;">ثبت جواب</button>
      <p id="riddleMsg" style="margin-top: 10px; font-size: 0.85rem;"></p>
    </div>

    <div class="game-grid">
      <a href="mafia.html" class="game-tile">
        <span class="game-icon">🕵️</span><span class="game-name">بازی مافیا</span>
      </a>
      <a href="mbti.html" class="game-tile">
        <span class="game-icon">🧠</span><span class="game-name">هم‌سلیقه‌یاب</span>
      </a>
    </div>

  </main>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">🏠 خانه</a>
    <a href="study.html" class="nav-item">⏱ مطالعه</a>
    <a href="games.html" class="nav-item active">🎮 بازی</a>
    <a href="shop.html" class="nav-item">🛒 فروشگاه</a>
    <a href="profile.html" class="nav-item">👤 پروفایل</a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="auth.js"></script>
  <script src="theme.js"></script>
  <script src="pwa.js"></script>
  
  <script>
    var myUid = null;
    var currentRiddle = null;

    supabaseClient.auth.getUser().then(function(res) {
      if (!res.data.user) { window.location.href = 'login.html'; return; }
      myUid = res.data.user.id;
      
      supabaseClient.from('profiles').select('username').eq('id', myUid).single().then(function(p) {
        if (p.data) {
          document.querySelector('.user-name').textContent = p.data.username;
          document.querySelector('.avatar').textContent = p.data.username.charAt(0);
        }
      });
      
      loadRiddle();
    });

    function loadRiddle() {
      supabaseClient.from('riddles').select('*').then(function(res) {
        if (res.error) {
          document.getElementById('riddleQuestion').textContent = '❌ خطا: ' + res.error.message;
          return;
        }
        
        var riddles = (res.data || []).filter(function(r) { return r.is_active !== false; });
        
        if (riddles.length === 0) {
          document.getElementById('riddleQuestion').textContent = 'هنوز معمایی ثبت نشده.';
          return;
        }
        
        var today = new Date();
        var seed = today.getFullYear() * 10000 + (today.getMonth()+1) * 100 + today.getDate();
        var idx = seed % riddles.length;
        currentRiddle = riddles[idx];
        document.getElementById('riddleQuestion').textContent = currentRiddle.question;

        if (localStorage.getItem('riddle_solved_' + seed)) {
          document.getElementById('riddleMsg').textContent = '✅ امروز جواب دادی. فردا بیا!';
          document.getElementById('riddleMsg').style.color = 'var(--green)';
          document.getElementById('riddleAnswer').disabled = true;
        }
      });
    }

    function checkRiddle() {
      if (!currentRiddle) return;
      var answer = document.getElementById('riddleAnswer').value.trim();
      var msg = document.getElementById('riddleMsg');
      if (!answer) { msg.textContent = 'جوابت رو بنویس'; msg.style.color = '#e74c3c'; return; }

      // ⬇️ منطق چند جوابی (جدا شده با /)
      var normalize = function(s) {
        return s.replace(/ي/g, 'ی').replace(/ك/g, 'ک').replace(/\s+/g, ' ').trim();
      };
      
      var validAnswers = currentRiddle.answer.split('/').map(function(a) { return normalize(a); });
      
      if (validAnswers.indexOf(normalize(answer)) !== -1) {
        var today = new Date();
        var seed = today.getFullYear() * 10000 + (today.getMonth()+1) * 100 + today.getDate();
        
        if (localStorage.getItem('riddle_solved_' + seed)) {
          msg.textContent = 'قبلاً جواب داده بودی'; return;
        }

        msg.textContent = '✅ آفرین! درسته. +۱ XP گرفتی!';
        msg.style.color = 'var(--green)';
        localStorage.setItem('riddle_solved_' + seed, 'true');

        supabaseClient.from('profiles').select('xp').eq('id', myUid).single().then(function(p) {
          var newXp = ((p.data && p.data.xp) || 0) + 1;
          supabaseClient.from('profiles').update({ xp: newXp }).eq('id', myUid);
        });
        document.getElementById('riddleAnswer').disabled = true;
      } else {
        msg.textContent = '❌ اشتباهه، دوباره تلاش کن.';
        msg.style.color = '#e74c3c';
      }
    }
  </script>
</body>
</html>
