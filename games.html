<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بازی‌ها و معما | ساراگل</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .game-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 16px; text-align: center; }
    .chest-grid { display: flex; justify-content: space-around; gap: 10px; margin-top: 20px; }
    .chest { display: flex; flex-direction: column; align-items: center; gap: 10px; cursor: pointer; transition: 0.2s; }
    .chest:hover { transform: scale(1.1); }
    .chest-icon { font-size: 3rem; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5)); }
    .xp-badge { background: var(--gold); color: #000; padding: 4px 10px; border-radius: 10px; font-weight: bold; font-size: 0.8rem; }
  </style>
</head>
<body>

  <header class="header">
    <div class="logo">ساراگل</div>
    <div class="user-area">
      <span class="user-name">—</span>
      <div class="avatar">—</div>
    </div>
  </header>

  <main class="container">
    <h2>🎮 بازی و سرگرمی</h2>

    <div class="game-card">
      <h3>🧠 معمای روز</h3>
      <p style="margin: 10px 0; font-size: 0.95rem;">آن چیست که هرچه از آن برداری، بزرگ‌تر می‌شود؟</p>
      <input type="text" id="riddleAnswer" class="input" placeholder="جوابت رو بنویس...">
      <button onclick="checkRiddle()" class="btn btn-blue btn-full" style="margin-top: 10px;">ثبت جواب</button>
      <p id="riddleMsg" style="margin-top: 10px; font-size: 0.85rem;"></p>
    </div>

    <div class="game-card">
      <h3>🎁 صندوقچه‌ها</h3>
      <p style="font-size: 0.85rem; color: var(--text-dim);">با XP هات صندوق باز کن و جایزه بگیر!</p>
      
      <div class="chest-grid">
        <div class="chest" onclick="openChest('bronze', 50)">
          <div class="chest-icon">📦</div>
          <div class="xp-badge">۵۰ XP</div>
          <span style="font-size: 0.8rem;">برنزی</span>
        </div>
        <div class="chest" onclick="openChest('silver', 100)">
          <div class="chest-icon">🥈</div>
          <div class="xp-badge">۱۰۰ XP</div>
          <span style="font-size: 0.8rem;">نقره‌ای</span>
        </div>
        <div class="chest" onclick="openChest('gold', 200)">
          <div class="chest-icon">🥇</div>
          <div class="xp-badge">۲۰۰ XP</div>
          <span style="font-size: 0.8rem;">طلایی</span>
        </div>
      </div>
    </div>

  </main>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">🏠 خانه</a>
    <a href="study.html" class="nav-item">⏱ مطالعه</a>
    <a href="profile.html" class="nav-item">👤 پروفایل</a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="auth.js"></script>
  <script src="theme.js"></script>
  <script>
    function checkRiddle() {
      var answer = document.getElementById('riddleAnswer').value.trim();
      var msg = document.getElementById('riddleMsg');
      if (answer === 'چاله' || answer === 'گودال') {
        msg.textContent = '✅ آفرین! درسته. ۵۰ XP گرفتی!';
        msg.style.color = 'var(--green)';
        // در اینجا می‌تونیم به دیتابیس وصل کنیم که XP اضافه بشه
      } else {
        msg.textContent = '❌ اشتباهه، دوباره تلاش کن.';
        msg.style.color = '#e74c3c';
      }
    }

    function openChest(type, cost) {
      // در حالت واقعی باید XP از دیتابیس چک بشه
      if (confirm('آیا می‌خوای این صندوق رو باز کنی؟ (' + cost + ' XP)')) {
        var prizes = {
          'bronze': '۵۰ XP یا یک استیکر',
          'silver': '۱۵۰ XP یا یک قاب آواتار',
          'gold': '۵۰۰ XP یا یک نشان ویژه'
        };
        alert('🎉 تبریک! تو برنده شدی: ' + prizes[type]);
      }
    }
  </script>
</body>
</html>
