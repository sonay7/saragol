<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>آزمونک | ساراگل</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .quiz-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; text-align: center; }
    .progress-bar { width: 100%; height: 8px; background: var(--border); border-radius: 10px; margin-bottom: 20px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--green); width: 0%; transition: width 0.3s; }
    .question-text { font-size: 1.1rem; font-weight: bold; margin-bottom: 20px; }
    .result-box { text-align: center; }
    .result-box h2 { font-size: 1.5rem; margin-bottom: 12px; }
  </style>
</head>
<body>

<header class="header">
  <div class="logo">ساراگل</div>
  <div class="user-area">
    <span class="user-name">—</span>
    <div class="avatar">—</div>
  </div>
</header>

<main class="container">
  <div id="quizScreen" class="quiz-box">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <p style="font-size: 0.8rem; color: var(--text-dim); margin-bottom: 8px;">سوال <span id="qNum">1</span> از <span id="qTotal">10</span></p>
    <div class="question-text" id="questionText">...</div>
    <input id="answerInput" class="input" placeholder="جواب رو بنویس..." style="margin-bottom: 12px;">
    <button onclick="submitAnswer()" class="btn btn-green btn-full">ثبت جواب</button>
  </div>

  <div id="resultScreen" class="quiz-box" style="display: none;">
    <div class="result-box">
      <div style="font-size: 4rem; margin-bottom: 12px;" id="resultIcon">🎉</div>
      <h2 id="resultText">...</h2>
      <p id="resultSub" style="font-size: 0.9rem; color: var(--text-dim); margin-bottom: 20px;"></p>
      <button onclick="location.reload()" class="btn btn-blue btn-full">🔄 تلاش مجدد</button>
      <button onclick="location.href='flashcards.html'" class="btn btn-dim btn-full" style="margin-top: 8px;">بازگشت</button>
    </div>
  </div>
</main>

<nav class="bottom-nav">
  <a href="index.html" class="nav-item">🏠 خانه</a>
  <a href="study.html" class="nav-item">⏱ مطالعه</a>
  <a href="flashcards.html" class="nav-item">🃏 فلش‌کارت</a>
  <a href="shop.html" class="nav-item">🛒 فروشگاه</a>
  <a href="profile.html" class="nav-item">👤 پروفایل</a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="auth.js"></script>
<script src="theme.js"></script>
<script>
  var currentUserId = null;
  var quizCards = [];
  var currentIdx = 0;
  var correctCount = 0;

  supabaseClient.auth.getUser().then(function(res) {
    if (!res.data.user) { window.location.href = 'login.html'; return; }
    currentUserId = res.data.user.id;
    supabaseClient.from('profiles').select('username').eq('id', currentUserId).single().then(function(p) {
      if (p.data) {
        document.querySelector('.user-name').textContent = p.data.username;
        document.querySelector('.avatar').textContent = p.data.username.charAt(0);
      }
    });
    
    supabaseClient.from('user_flashcards').select('*').eq('user_id', currentUserId).then(function(cRes) {
      var all = cRes.data || [];
      if (all.length < 3) { 
        document.getElementById('questionText').textContent = 'برای آزمون به حداقل ۳ کارت نیاز داری.';
        document.getElementById('answerInput').style.display = 'none';
        return;
      }
      
      // شافل و انتخاب ۵ کارت (یا هر چی بود)
      all.sort(function() { return 0.5 - Math.random(); });
      quizCards = all.slice(0, Math.min(10, all.length));
      
      document.getElementById('qTotal').textContent = quizCards.length;
      renderQuestion();
    });
  });

  function renderQuestion() {
    if (currentIdx >= quizCards.length) { finishQuiz(); return; }
    document.getElementById('qNum').textContent = currentIdx + 1;
    document.getElementById('questionText').textContent = quizCards[currentIdx].question;
    document.getElementById('answerInput').value = '';
    document.getElementById('progressFill').style.width = ((currentIdx) / quizCards.length * 100) + '%';
  }

  window.submitAnswer = function() {
    var ans = document.getElementById('answerInput').value.trim();
    var correct = quizCards[currentIdx].answer.trim();
    
    if (ans === correct) { correctCount++; }
    
    currentIdx++;
    renderQuestion();
  };

  function finishQuiz() {
    document.getElementById('quizScreen').style.display = 'none';
    document.getElementById('resultScreen').style.display = 'block';
    
    var percent = Math.round((correctCount / quizCards.length) * 100);
    if (percent >= 80) {
      document.getElementById('resultIcon').textContent = '🎉';
      document.getElementById('resultText').textContent = 'آفرین! قبول شدی';
      document.getElementById('resultText').style.color = 'var(--green)';
      // ثبت ماموریت
      markQuestDone();
    } else {
      document.getElementById('resultIcon').textContent = '😔';
      document.getElementById('resultText').textContent = 'متاسفانه قبول نشدی';
      document.getElementById('resultText').style.color = '#e74c3c';
    }
    document.getElementById('resultSub').textContent = 'نمره شما: ' + percent + '% (' + correctCount + ' از ' + quizCards.length + ')';
  }

  function markQuestDone() {
    supabaseClient.auth.getUser().then(function(res) {
      if (!res.data.user) return;
      // اینجا می‌تونیم ماموریت رو ثبت کنیم (در فاز بعد)
    });
  }
</script>
</body>
</html>
