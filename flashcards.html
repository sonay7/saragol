<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فلش‌کارت‌ها | ساراگل</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab-btn { flex: 1; padding: 10px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; color: var(--text); cursor: pointer; font-family: inherit; }
    .tab-btn.active { background: var(--green); color: #fff; border-color: var(--green); }
    .card-item { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 10px; position: relative; }
    .card-q { font-weight: bold; margin-bottom: 6px; color: var(--blue); }
    .card-a { font-size: 0.9rem; color: var(--text); }
    .card-actions { position: absolute; top: 10px; left: 10px; display: flex; gap: 6px; }
    .card-actions button { background: none; border: none; cursor: pointer; font-size: 1rem; }
  </style>
</head>
<body>

<header class="header">
  <div class="logo">ساراگل</div>
  <div class="user-area">
    <span class="user-name">—</span>
    <div class="avatar">—</div>
  </div>
</header>

<main class="container">
  <h2 style="margin-bottom: 20px;">🃏 فلش‌کارت‌ها</h2>
  
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('my')">🃏 کارت‌های من</button>
    <button class="tab-btn" onclick="switchTab('public')">📖 نکات عمومی</button>
  </div>

  <!-- تب کارت‌های من -->
  <div id="myCardsTab">
    <div style="background: var(--bg-card); padding: 16px; border-radius: 12px; margin-bottom: 16px;">
      <p style="font-size: 0.85rem; margin-bottom: 8px;">کارت جدید بساز:</p>
      <input id="newQuestion" class="input" placeholder="سوال (مثلاً: فرمول مساحت دایره؟)" style="margin-bottom: 8px;">
      <input id="newAnswer" class="input" placeholder="جواب (مثلاً: πr²)" style="margin-bottom: 8px;">
      <button onclick="addPersonalCard()" class="btn btn-green btn-full">➕ افزودن</button>
    </div>
    <div style="margin-bottom: 16px;">
      <button onclick="startQuiz()" class="btn btn-blue btn-full" id="startQuizBtn" style="display:none;">🚀 شروع آزمونک</button>
    </div>
    <div id="myCardsList"></div>
  </div>

  <!-- تب نکات عمومی -->
  <div id="publicCardsTab" style="display: none;">
    <p style="font-size: 0.8rem; color: var(--text-dim); margin-bottom: 12px;">این نکات توسط ادمین ثبت شدن. می‌تونی به مجموعه خودت اضافه‌شون کنی.</p>
    <div id="publicCardsList"></div>
  </div>

</main>

<nav class="bottom-nav">
  <a href="index.html" class="nav-item">🏠 خانه</a>
  <a href="study.html" class="nav-item">⏱ مطالعه</a>
  <a href="flashcards.html" class="nav-item active">🃏 فلش‌کارت</a>
  <a href="shop.html" class="nav-item">🛒 فروشگاه</a>
  <a href="profile.html" class="nav-item">👤 پروفایل</a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="auth.js"></script>
<script src="theme.js"></script>
<script>
  var currentUserId = null;
  var userGrade = '';
  var myCards = [];

  supabaseClient.auth.getUser().then(function(res) {
    if (!res.data.user) { window.location.href = 'login.html'; return; }
    currentUserId = res.data.user.id;
    supabaseClient.from('profiles').select('username, class_name').eq('id', currentUserId).single().then(function(p) {
      if (p.data) {
        document.querySelector('.user-name').textContent = p.data.username;
        document.querySelector('.avatar').textContent = p.data.username.charAt(0);
        userGrade = p.data.class_name.replace(/[0-9 ]/g, ''); // مثلا "نهم"
      }
      loadMyCards();
      loadPublicCards();
    });
  });

  window.switchTab = function(tab) {
    document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
    event.target.classList.add('active');
    if (tab === 'my') {
      document.getElementById('myCardsTab').style.display = 'block';
      document.getElementById('publicCardsTab').style.display = 'none';
    } else {
      document.getElementById('myCardsTab').style.display = 'none';
      document.getElementById('publicCardsTab').style.display = 'block';
    }
  };

  function loadMyCards() {
    supabaseClient.from('user_flashcards').select('*').eq('user_id', currentUserId).order('created_at', { ascending: false }).then(function(res) {
      myCards = res.data || [];
      var list = document.getElementById('myCardsList');
      list.innerHTML = '';
      if (myCards.length === 0) { list.innerHTML = '<p class="lock-note">هنوز کارتی نساختی.</p>'; return; }
      
      myCards.forEach(function(c) {
        var div = document.createElement('div');
        div.className = 'card-item';
        div.innerHTML = `<div class="card-q">❓ ${c.question}</div><div class="card-a">✅ ${c.answer}</div>
          <div class="card-actions"><button onclick="delCard('${c.id}')">🗑️</button></div>`;
        list.appendChild(div);
      });
      
      if (myCards.length >= 3) {
        document.getElementById('startQuizBtn').style.display = 'block';
      }
    });
  }

  window.addPersonalCard = function() {
    var q = document.getElementById('newQuestion').value.trim();
    var a = document.getElementById('newAnswer').value.trim();
    if (!q || !a) return alert('سوال و جواب رو پر کن');
    supabaseClient.from('user_flashcards').insert({ user_id: currentUserId, subject: 'عمومی', question: q, answer: a }).then(function() {
      document.getElementById('newQuestion').value = '';
      document.getElementById('newAnswer').value = '';
      loadMyCards();
    });
  };

  window.delCard = function(id) {
    if (confirm('حذف بشه؟')) supabaseClient.from('user_flashcards').delete().eq('id', id).then(loadMyCards);
  };

  function loadPublicCards() {
    if (!userGrade) { document.getElementById('publicCardsList').innerHTML = '<p class="lock-note">پایه‌ت مشخص نیست.</p>'; return; }
    supabaseClient.from('flashcards').select('*').eq('grade', userGrade).then(function(res) {
      var rows = res.data || [];
      var list = document.getElementById('publicCardsList');
      list.innerHTML = '';
      if (rows.length === 0) { list.innerHTML = '<p class="lock-note">نکته‌ای برای پایه شما ثبت نشده.</p>'; return; }
      
      rows.forEach(function(c) {
        var div = document.createElement('div');
        div.className = 'card-item';
        div.innerHTML = `<div class="card-q">❓ ${c.question} <span style="font-size:0.7rem; color:var(--text-dim);">(${c.subject})</span></div>
          <div class="card-a">✅ ${c.answer}</div>
          <div class="card-actions"><button onclick="addToMyCards('${c.question}', '${c.answer}')">➕</button></div>`;
        list.appendChild(div);
      });
    });
  }

  window.addToMyCards = function(q, a) {
    supabaseClient.from('user_flashcards').insert({ user_id: currentUserId, subject: 'عمومی', question: q, answer: a }).then(function() {
      alert('به کارت‌های خودت اضافه شد!');
      loadMyCards();
    });
  };

  window.startQuiz = function() {
    window.location.href = 'quiz.html';
  };
</script>
</body>
</html>
