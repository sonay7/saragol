<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دفترچه خاطرات | ساراگل</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .journal-container { background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; padding: 20px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    .journal-date { text-align: center; font-size: 0.9rem; color: var(--text-dim); margin-bottom: 16px; font-weight: bold; }
    
    .mood-selector { display: flex; justify-content: space-around; margin-bottom: 16px; background: var(--bg); padding: 10px; border-radius: 12px; border: 1px solid var(--border); }
    .mood-item { font-size: 1.8rem; cursor: pointer; transition: 0.2s; opacity: 0.4; filter: grayscale(1); }
    .mood-item:hover { transform: scale(1.2); opacity: 1; filter: grayscale(0); }
    .mood-item.selected { opacity: 1; filter: grayscale(0); transform: scale(1.2); }

    .journal-textarea { width: 100%; min-height: 150px; padding: 16px; border-radius: 14px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-family: inherit; font-size: 1rem; line-height: 1.8; resize: vertical; box-sizing: border-box; }
    .journal-textarea:focus { outline: none; border-color: var(--green); }

    .past-entries { margin-top: 30px; }
    .entry-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
    .entry-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-bottom: 1px dashed var(--border); padding-bottom: 8px; }
    .entry-date { font-size: 0.8rem; color: var(--text-dim); }
    .entry-mood { font-size: 1.5rem; }
    .entry-text { font-size: 0.95rem; line-height: 1.8; }
  </style>
</head>
<body>

<header class="header">
  <div class="logo">ساراگل</div>
  <div class="user-area">
    <span class="user-name">—</span>
    <div class="avatar">—</div>
  </div>
</header>

<main class="container">
  <h2 style="text-align: center; margin-bottom: 20px;">📔 دفترچه خاطرات</h2>
  
  <div class="journal-container">
    <div class="journal-date" id="todayDate"></div>
    
    <div class="mood-selector" id="moodSelector">
      <span class="mood-item" data-mood="😄" onclick="selectMood(this)">😄</span>
      <span class="mood-item" data-mood="🙂" onclick="selectMood(this)">🙂</span>
      <span class="mood-item" data-mood="😐" onclick="selectMood(this)">😐</span>
      <span class="mood-item" data-mood="😔" onclick="selectMood(this)">😔</span>
      <span class="mood-item" data-mood="😡" onclick="selectMood(this)">😡</span>
    </div>

    <textarea id="journalText" class="journal-textarea" placeholder="امروز چه خبر؟ هر چیزی که دلت می‌خواد بنویس..."></textarea>
    
    <button onclick="saveJournal()" class="btn btn-green btn-full" style="margin-top: 12px;">💾 ثبت خاطره</button>
    <p id="journalMsg" style="text-align: center; font-size: 0.85rem; margin-top: 8px;"></p>
  </div>

  <div class="past-entries" id="pastEntries">
    <h3 style="font-size: 1rem; margin-bottom: 12px;">📖 خاطرات قبلی من:</h3>
    <p class="lock-note">در حال بارگذاری...</p>
  </div>
</main>

<nav class="bottom-nav">
  <a href="index.html" class="nav-item">🏠 خانه</a>
  <a href="study.html" class="nav-item">⏱ مطالعه</a>
  <a href="journal.html" class="nav-item active">📔 خاطرات</a>
  <a href="shop.html" class="nav-item">🛒 فروشگاه</a>
  <a href="profile.html" class="nav-item">👤 پروفایل</a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="auth.js"></script>
<script src="theme.js"></script>
<script>
  var myUid = null, currentSelectedMood = '🙂', editingEntryId = null;

  // تنظیم تاریخ امروز
  var today = new Date();
  document.getElementById('todayDate').textContent = new Intl.DateTimeFormat('fa-IR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }).format(today);

  supabaseClient.auth.getUser().then(function(res) {
    if (!res.data.user) { window.location.href = 'login.html'; return; }
    myUid = res.data.user.id;
    
    supabaseClient.from('profiles').select('username').eq('id', myUid).single().then(function(p) {
      if (p.data) {
        document.querySelector('.user-name').textContent = p.data.username;
        document.querySelector('.avatar').textContent = p.data.username.charAt(0);
      }
    });

    loadJournals();
  });

  window.selectMood = function(el) {
    document.querySelectorAll('.mood-item').forEach(function(m) { m.classList.remove('selected'); });
    el.classList.add('selected');
    currentSelectedMood = el.getAttribute('data-mood');
  };

  // انتخاب پیش‌فرض
  document.querySelector('.mood-item[data-mood="🙂"]').classList.add('selected');

  window.saveJournal = function() {
    var text = document.getElementById('journalText').value.trim();
    var msg = document.getElementById('journalMsg');
    if (text.length < 5) { msg.textContent = 'یه کم بیشتر بنویس!'; msg.style.color = '#e74c3c'; return; }
    msg.textContent = 'در حال ذخیره...'; msg.style.color = 'var(--text-dim)';

    if (editingEntryId) {
      // ویرایش
      supabaseClient.from('user_journals').update({ text: text, mood: currentSelectedMood, updated_at: new Date().toISOString() }).eq('id', editingEntryId).then(function(res) {
        if (res.error) { msg.textContent = 'خطا: ' + res.error.message; msg.style.color = '#e74c3c'; return; }
        msg.textContent = '✅ ویرایش شد!'; msg.style.color = 'var(--green)';
        document.getElementById('journalText').value = '';
        editingEntryId = null;
        loadJournals();
      });
    } else {
      // ثبت جدید
      supabaseClient.from('user_journals').insert({ user_id: myUid, text: text, mood: currentSelectedMood }).then(function(res) {
        if (res.error) { msg.textContent = 'خطا: ' + res.error.message; msg.style.color = '#e74c3c'; return; }
        msg.textContent = '✅ ثبت شد!'; msg.style.color = 'var(--green)';
        document.getElementById('journalText').value = '';
        loadJournals();
      });
    }
  };

  function loadJournals() {
    var box = document.getElementById('pastEntries');
    supabaseClient.from('user_journals').select('*').eq('user_id', myUid).order('created_at', { ascending: false }).then(function(res) {
      box.innerHTML = '<h3 style="font-size: 1rem; margin-bottom: 12px;">📖 خاطرات قبلی من:</h3>';
      var rows = res.data || [];
      if (rows.length === 0) { box.innerHTML += '<p class="lock-note">هنوز خاطره‌ای ننوشتی.</p>'; return; }

      rows.forEach(function(j) {
        var div = document.createElement('div');
        div.className = 'entry-card';
        var dt = new Intl.DateTimeFormat('fa-IR', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }).format(new Date(j.created_at));
        div.innerHTML = `
          <div class="entry-header">
            <span class="entry-date">${dt}</span>
            <span class="entry-mood">${j.mood || '🙂'}</span>
          </div>
          <div class="entry-text">${j.text}</div>
          <div style="margin-top: 10px; text-align: left;">
            <button class="btn btn-dim btn-sm" onclick="editJournal('${j.id}', '${j.text.replace(/'/g, "\\'")}', '${j.mood}')">✏️ ویرایش</button>
            <button class="btn btn-dim btn-sm" style="color:#e74c3c;" onclick="deleteJournal('${j.id}')">🗑️</button>
          </div>
        `;
        box.appendChild(div);
      });
    });
  }

  window.editJournal = function(id, text, mood) {
    editingEntryId = id;
    document.getElementById('journalText').value = text;
    currentSelectedMood = mood || '🙂';
    
    document.querySelectorAll('.mood-item').forEach(function(m) { m.classList.remove('selected'); });
    document.querySelector('.mood-item[data-mood="' + currentSelectedMood + '"]').classList.add('selected');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  window.deleteJournal = function(id) {
    if (confirm('این خاطره حذف بشه؟')) {
      supabaseClient.from('user_journals').delete().eq('id', id).then(function() { loadJournals(); });
    }
  };
</script>
</body>
</html>
