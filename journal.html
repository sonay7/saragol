<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دفترچه خاطرات | ساراگل</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .journal-container {
      max-width: 600px;
      margin: 20px auto;
      background: #fff9f0; /* رنگ کرم دفترچه */
      border: 2px solid #e8d8c3;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      color: #4a3b32;
      position: relative;
      background-image: radial-gradient(#e0d0b8 1px, transparent 1px);
      background-size: 20px 20px; /* افکت خط‌چین */
    }
    .journal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      background: rgba(255,255,255,0.7);
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #e8d8c3;
    }
    .journal-header h2 {
      font-size: 1.2rem;
      color: #8b5a2b;
    }
    .journal-date {
      font-size: 0.85rem;
      color: #a48f7b;
      font-weight: bold;
    }
    .note-card {
      background: #ffffff;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      border-left: 5px solid #f7b731;
      position: relative;
    }
    .note-card.pink { border-left-color: #ff9ff3; }
    .note-card.blue { border-left-color: #48dbfb; }
    .note-card.green { border-left-color: #1dd1a1; }
    .note-text {
      font-size: 0.95rem;
      line-height: 1.8;
      white-space: pre-wrap;
    }
    .note-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      font-size: 0.7rem;
      color: #a48f7b;
    }
    .edit-btn, .delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.8rem;
      margin-left: 8px;
    }
    .new-note-area textarea {
      width: 100%;
      min-height: 120px;
      border: 1px solid #e8d8c3;
      border-radius: 12px;
      padding: 15px;
      font-family: inherit;
      font-size: 0.95rem;
      background: #ffffff;
      resize: vertical;
      outline: none;
    }
    .new-note-area textarea:focus {
      border-color: #f7b731;
    }
    .btn-journal {
      background: #f7b731;
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      width: 100%;
      transition: 0.2s;
    }
    .btn-journal:hover {
      background: #e1a622;
    }
  </style>
</head>
<body>

<header class="header">
  <div class="logo">ساراگل</div>
  <div class="user-area">
    <span class="user-name">—</span>
    <div class="avatar">—</div>
  </div>
</header>

<main class="container">
  <div class="journal-container">
    <div class="journal-header">
      <h2>📔 دفترچه خاطرات</h2>
      <span class="journal-date" id="todayDate">—</span>
    </div>

    <div class="new-note-area">
      <textarea id="noteInput" placeholder="امروز چه اتفاق خوبی افتاد؟..."></textarea>
      <button class="btn-journal" id="saveNoteBtn">✏️ ثبت خاطره</button>
    </div>

    <div id="notesList" style="margin-top: 20px;">
      <p class="lock-note">در حال بارگذاری...</p>
    </div>
  </div>
</main>

<nav class="bottom-nav">
  <a href="index.html" class="nav-item">🏠 خانه</a>
  <a href="study.html" class="nav-item">⏱ مطالعه</a>
  <a href="journal.html" class="nav-item active">📔 دفترچه</a>
  <a href="shop.html" class="nav-item">🛒 فروشگاه</a>
  <a href="profile.html" class="nav-item">👤 پروفایل</a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="auth.js"></script>
<script src="theme.js"></script>
<script src="pwa.js"></script>

<script>
  var currentUser = null;
  var editingNoteId = null;
  var noteColors = ['pink', 'blue', 'green', '']; // رنگ‌های پس‌زمینه

  supabaseClient.auth.getUser().then(function(res) {
    if (!res.data.user) { window.location.href = 'login.html'; return; }
    currentUser = res.data.user;
    
    supabaseClient.from('profiles').select('username').eq('id', currentUser.id).single().then(function(p) {
      if (p.data) {
        document.querySelector('.user-name').textContent = p.data.username;
        document.querySelector('.avatar').textContent = p.data.username.charAt(0);
      }
    });

    var today = new Date();
    document.getElementById('todayDate').textContent = new Intl.DateTimeFormat('fa-IR', { year: 'numeric', month: 'long', day: 'numeric' }).format(today);
    loadNotes();
  });

  document.getElementById('saveNoteBtn').addEventListener('click', function() {
    var text = document.getElementById('noteInput').value.trim();
    if (text.length < 3) { alert('یه کم بیشتر بنویس!'); return; }

    if (editingNoteId) {
      // ویرایش
      supabaseClient.from('user_journals').update({ text: text, updated_at: new Date().toISOString() }).eq('id', editingNoteId).then(function(res) {
        if (res.error) { alert('خطا'); return; }
        document.getElementById('noteInput').value = '';
        editingNoteId = null;
        document.getElementById('saveNoteBtn').textContent = '✏️ ثبت خاطره';
        loadNotes();
      });
    } else {
      // ثبت جدید
      supabaseClient.from('user_journals').insert({
        user_id: currentUser.id,
        text: text,
        created_at: new Date().toISOString()
      }).then(function(res) {
        if (res.error) { alert('خطا: ' + res.error.message); return; }
        document.getElementById('noteInput').value = '';
        loadNotes();
      });
    }
  });

  function loadNotes() {
    var list = document.getElementById('notesList');
    supabaseClient.from('user_journals').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false }).then(function(res) {
      list.innerHTML = '';
      var rows = res.data || [];
      if (rows.length === 0) { list.innerHTML = '<p class="lock-note">هنوز خاطره‌ای ننوشتی.</p>'; return; }
      
      rows.forEach(function(note, index) {
        var colorClass = noteColors[index % noteColors.length];
        var div = document.createElement('div');
        div.className = 'note-card ' + colorClass;
        var dt = new Intl.DateTimeFormat('fa-IR', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }).format(new Date(note.created_at));
        
        div.innerHTML = '<div class="note-text">' + note.text.replace(/\n/g, '<br>') + '</div>' +
          '<div class="note-footer">' +
            '<span>' + dt + '</span>' +
            '<div>' +
              '<button class="edit-btn" onclick="editNote(' + note.id + ', \'' + note.text.replace(/'/g, "\\'") + '\')">✏️</button>' +
              '<button class="delete-btn" onclick="deleteNote(' + note.id + ')">🗑️</button>' +
            '</div>' +
          '</div>';
        list.appendChild(div);
      });
    });
  }

  window.editNote = function(id, text) {
    document.getElementById('noteInput').value = text;
    editingNoteId = id;
    document.getElementById('saveNoteBtn').textContent = '💾 ذخیره ویرایش';
    document.getElementById('noteInput').focus();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  window.deleteNote = function(id) {
    if (confirm('این خاطره پاک بشه؟')) {
      supabaseClient.from('user_journals').delete().eq('id', id).then(function() { loadNotes(); });
    }
  };
</script>
</body>
</html>
