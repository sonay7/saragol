<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دفترچه خاطرات | ساراگل</title>
  
  <!-- اضافه کردن فونت زیبای وزیرمتن -->
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  
  <style>
    /* تنظیمات کلی صفحه */
    body {
      font-family: 'Vazirmatn', sans-serif;
      background: var(--bg, #0f172a);
      color: var(--text, #e2e8f0);
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 20px;
      padding-bottom: 80px; /* برای اینکه با منوی پایین تداخل نکنه */
    }

    /* کارت اصلی ژورنال با افکت شیشه‌ای */
    .journal-container { 
      background: rgba(30, 41, 59, 0.7); 
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1); 
      border-radius: 24px; 
      padding: 24px; 
      margin-bottom: 24px; 
      box-shadow: 0 15px 35px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.05); 
    }

    .journal-date { 
      text-align: center; 
      font-size: 0.95rem; 
      color: var(--text-dim, #94a3b8); 
      margin-bottom: 20px; 
      font-weight: 500;
      letter-spacing: 0.5px;
    }
    
    /* باکس سوال روز با افکت درخشش */
    .daily-prompt-box { 
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(5, 150, 105, 0.05)); 
      border: 1px solid rgba(16, 185, 129, 0.3); 
      border-radius: 16px; 
      padding: 20px; 
      margin-bottom: 24px; 
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(16, 185, 129, 0.1);
    }
    .daily-prompt-box::before {
      content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
      transform: skewX(-20deg);
      animation: shine 6s infinite;
    }
    @keyframes shine {
      0% { left: -100%; } 20% { left: 200%; } 100% { left: 200%; }
    }
    .daily-prompt-title { 
      font-size: 0.85rem; 
      color: #10b981; 
      margin-bottom: 10px; 
      font-weight: 700; 
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .daily-prompt-text { 
      font-size: 1.05rem; 
      color: #f1f5f9; 
      line-height: 1.8; 
      font-weight: 500; 
    }

    /* انتخاب مود (حال و هوا) */
    .mood-selector { 
      display: flex; 
      justify-content: space-around; 
      margin-bottom: 20px; 
      background: rgba(15, 23, 42, 0.6); 
      padding: 15px 10px; 
      border-radius: 16px; 
      border: 1px solid rgba(255, 255, 255, 0.05); 
    }
    .mood-item { 
      font-size: 2rem; 
      cursor: pointer; 
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
      opacity: 0.4; 
      filter: grayscale(1); 
      position: relative;
    }
    .mood-item:hover { 
      transform: translateY(-5px) scale(1.15); 
      opacity: 1; 
      filter: grayscale(0); 
    }
    .mood-item.selected { 
      opacity: 1; 
      filter: grayscale(0); 
      transform: translateY(-5px) scale(1.3); 
      text-shadow: 0 0 20px rgba(255,255,255,0.5);
    }

    /* ناحیه نوشتن متن */
    .textarea-wrapper {
      position: relative;
      margin-bottom: 15px;
    }
    .journal-textarea { 
      width: 100%; 
      min-height: 180px; 
      padding: 18px; 
      border-radius: 16px; 
      border: 1px solid rgba(255, 255, 255, 0.1); 
      background: rgba(15, 23, 42, 0.8); 
      color: #f8fafc; 
      font-family: inherit; 
      font-size: 1.05rem; 
      line-height: 2; 
      resize: vertical; 
      box-sizing: border-box; 
      transition: all 0.3s ease;
      box-shadow: inset 0 4px 15px rgba(0,0,0,0.2);
    }
    .journal-textarea:focus { 
      outline: none; 
      border-color: #10b981; 
      box-shadow: inset 0 4px 15px rgba(0,0,0,0.2), 0 0 0 3px rgba(16, 185, 129, 0.2);
    }
    .journal-textarea::placeholder {
      color: #475569;
    }
    
    /* شمارنده کاراکتر */
    .char-counter {
      position: absolute;
      bottom: 12px;
      left: 15px;
      font-size: 0.75rem;
      color: #64748b;
      pointer-events: none;
    }

    /* دکمه ثبت */
    .btn-green { 
      background: linear-gradient(135deg, #10b981, #059669);
      color: white; 
      border: none; 
      padding: 14px 20px; 
      border-radius: 14px; 
      font-family: inherit; 
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer; 
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
      width: 100%;
    }
    .btn-green:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
    }
    .btn-green:active {
      transform: translateY(0);
    }
    .btn-green:disabled {
      opacity: 0.7; cursor: not-allowed; transform: none;
    }

    /* لیست خاطرات قبلی */
    .past-entries { 
      margin-top: 30px; 
    }
    .past-entries h3 {
      font-weight: 700; color: #cbd5e1; font-size: 1.1rem;
      margin-bottom: 16px;
    }
    .entry-card { 
      background: rgba(30, 41, 59, 0.5); 
      border: 1px solid rgba(255, 255, 255, 0.05); 
      border-radius: 16px; 
      padding: 20px; 
      margin-bottom: 16px; 
      transition: all 0.3s ease;
    }
    .entry-card:hover {
      transform: translateY(-3px);
      background: rgba(30, 41, 59, 0.8);
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      border-color: rgba(255, 255, 255, 0.1);
    }
    .entry-header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 12px; 
      border-bottom: 1px dashed rgba(255, 255, 255, 0.1); 
      padding-bottom: 12px; 
    }
    .entry-date { font-size: 0.8rem; color: #94a3b8; font-weight: 500; }
    .entry-mood { font-size: 1.5rem; }
    .entry-text { 
      font-size: 1rem; 
      line-height: 1.9; 
      white-space: pre-wrap; 
      color: #e2e8f0;
    }

    /* آمار حال و هوا */
    .mood-stats-container { 
      display: flex; gap: 15px; justify-content: space-between; 
      margin-bottom: 24px; 
      background: rgba(30, 41, 59, 0.5); 
      padding: 15px 20px; border-radius: 16px; 
      border: 1px solid rgba(255, 255, 255, 0.05); 
      flex-wrap: wrap;
    }
    .mood-stat-item { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; min-width: 50px; }
    .mood-stat-bar-wrapper { width: 100%; height: 6px; background: rgba(15, 23, 42, 0.8); border-radius: 4px; overflow: hidden; }
    .mood-stat-bar { height: 100%; background: linear-gradient(90deg, #34d399, #10b981); border-radius: 4px; transition: width 1s ease; }
    .mood-stat-label { font-size: 0.75rem; color: #94a3b8; font-weight: 500; }
    
    .btn-dim { background: rgba(255,255,255,0.05); border: none; color: #cbd5e1; padding: 6px 12px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    .btn-dim:hover { background: rgba(255,255,255,0.1); }
    .lock-note { text-align: center; color: #64748b; font-size: 0.9rem; }
  </style>
</head>
<body>

<header class="header">
  <div class="logo">ساراگل</div>
  <div class="user-area">
    <span class="user-name">—</span>
    <div class="avatar">—</div>
  </div>
</header>

<main class="container">
  <h2 style="text-align: center; margin-bottom: 24px; font-weight: 700; color: #f8fafc; font-size: 1.6rem;">📔 دفترچه خاطرات</h2>

  <!-- بخش آمار حال و هوا -->
  <div id="moodStats" class="mood-stats-container" style="display: none;"></div>
  
  <div class="journal-container">
    <div class="journal-date" id="todayDate"></div>
    
    <!-- باکس سوال روز -->
    <div class="daily-prompt-box" id="dailyPromptBox">
      <div class="daily-prompt-title">✨ سوال امروز برای تفکر</div>
      <div class="daily-prompt-text" id="dailyPromptText">در حال بارگذاری...</div>
    </div>

    <div class="mood-selector" id="moodSelector">
      <span class="mood-item" data-mood="😄" onclick="selectMood(this)">😄</span>
      <span class="mood-item" data-mood="🙂" onclick="selectMood(this)">🙂</span>
      <span class="mood-item" data-mood="😐" onclick="selectMood(this)">😐</span>
      <span class="mood-item" data-mood="😔" onclick="selectMood(this)">😔</span>
      <span class="mood-item" data-mood="😡" onclick="selectMood(this)">😡</span>
    </div>

    <div class="textarea-wrapper">
      <textarea id="journalText" class="journal-textarea" placeholder="امروز چه خبر؟ هر چیزی که دلت می‌خواد بنویس..." maxlength="1000"></textarea>
      <div class="char-counter" id="charCount">۰ / ۱۰۰۰</div>
    </div>
    
    <button onclick="saveJournal()" id="saveBtn" class="btn-green" style="margin-top: 5px;">💾 ثبت خاطره</button>
    <p id="journalMsg" style="text-align: center; font-size: 0.85rem; margin-top: 12px; font-weight: 500;"></p>
  </div>

  <div class="past-entries" id="pastEntries">
    <h3>📖 خاطرات قبلی من:</h3>
    <p class="lock-note">در حال بارگذاری...</p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="auth.js"></script>
<script src="theme.js"></script>
<script>
  var myUid = null;
  var currentSelectedMood = '🙂';
  var editingEntryId = null;
  var allJournals = []; 

  // سوالات عمیق
  var deepPrompts = [
    "اگر امروز می‌تونستی یه قانون توی دنیا رو تغییر بدی، اون قانون چی بود؟",
    "امروز چه ماسکی به چهره زدی که فقط خودت می‌دونی واقعی نیست؟",
    "آخرین باری که از ته دل خندیدی کِی بود و بابت چی بود؟",
    "چه چیزی هست که خیلی وقته می‌خوای ببخشیش ولی هنوز نتونستی؟",
    "اگر ۵ سال دیگه یه نامه به خودِ امروزت بنویسی، توش چی می‌نویسی؟",
    "امروز از چه چیزی فرار کردی؟ (حتی اگه فقط فکر کردن بهش بوده)",
    "کدوم تصمیم کوچیک امروزت، می‌تونه آینده‌ت رو عوض کنه؟",
    "چه ویژگی‌ای توی خودت داری که بقیه ازش بی‌خبرن؟",
    "امروز بابت چه چیزِ ساده‌ای (که قبلا برات عادی بود) شکرگزار بودی؟",
    "اگر قرار بود امروز فقط یک جمله از تو توی تاریخ بمونه، اون جمله چی بود؟",
    "آخرین باری که از خودت واقعاً خجالت کشیدی کِی بود و چه چیزی باعثش شد؟",
    "اگه قرار بود امروز یکی از ترس‌هات رو یه قدم به عقب هل بدی، اون ترس چی بود؟",
    "چه چیزی رو خیلی وقته با خودت حمل می‌کنی که دیگه مال تو نیست و باید بذاریش زمین؟",
    "اگه امروز می‌تونستی یه ویژگی از شخصیتت رو برای همیشه حذف کنی، کدوم رو انتخاب می‌کردی و چرا؟",
    "چه چیزی هست که فقط خودت ازش خبر داری و هرگز به کسی نگفتی؟",
    "امروز چه زمانی حس کردی که 'کاملاً خودت بودی'؟",
    "چه سوالی هست که خیلی وقته از خودت می‌پرسی ولی جوابش رو پیدا نکردی؟",
    "آخرین باری که یه نفر حرفی زد و 'قلبت رو شکست' کِی بود؟ (حتی اگه طرف مقابل قصدش بد نبوده)",
    "چه کسی رو توی زندگیت داری که خیلی دوستش داری ولی بهش نگفتی؟",
    "اگه می‌تونستی به یه نفر که دیگه توی زندگیت نیست یه جمله بگی، به کی می‌گفتی و چی می‌گفتی؟",
    "آخرین باری که یه نفر باعث شد به خودت افتخار کنی کِی بود؟",
    "چه چیزی رو توی یه رابطه، خیلی دیر فهمیدی؟",
    "اگه قرار بود امروز یکی از دوستات رو 'ببخشی' (حتی فقط توی دلت)، اون کی بود؟",
    "امروز چه چیزی باعث شد از کوره در بری؟ اگه دوباره اتفاق بیفته، چطور می‌خوای واکنش نشون بدی؟",
    "آخرین باری که گریه کردی، دلیل واقعیش چی بود؟ (نه دلیلی که به بقیه گفتی)",
    "چه چیزی هست که همیشه باعث میشه حالت بد بشه، ولی هیچ‌وقت به کسی نگفتی؟",
    "امروز چه لحظه‌ای بود که حس کردی 'انگار یه چیزی توی دلت سنگینی می‌کنه'؟",
    "اگه امروز قرار بود فقط یه احساس رو با خودت به خواب ببری، کدوم رو انتخاب می‌کردی؟",
    "چه زمانی حس کردی که داری به یه الگوی تکراری توی زندگیت برمی‌گردی؟",
    "امروز چه کاری کردی که 'بهتر از دیروزت' بودی، حتی اگه خیلی کوچیک بود؟",
    "چه چیزی توی زندگیت هست که حاضری براش بجنگی، ولی تا حالا به کسی نگفتی؟"
  ];

  // تنظیم تاریخ و سوال روز
  var today = new Date();
  document.getElementById('todayDate').textContent = new Intl.DateTimeFormat('fa-IR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }).format(today);
  
  var start = new Date(today.getFullYear(), 0, 0);
  var diff = (today - start) + ((start.getTimezoneOffset() - today.getTimezoneOffset()) * 60 * 1000);
  var oneDay = 1000 * 60 * 60 * 24;
  var dayOfYear = Math.floor(diff / oneDay);
  
  var todayPrompt = deepPrompts[dayOfYear % deepPrompts.length];
  document.getElementById('dailyPromptText').textContent = todayPrompt;

  // تبدیل اعداد انگلیسی به فارسی برای شمارنده
  function toPersianNum(num) {
    var persianDigits = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
    return num.toString().replace(/\d/g, function(x) { return persianDigits[x]; });
  }

  // مدیریت شمارنده کاراکتر و ذخیره خودکار
  var textarea = document.getElementById('journalText');
  var charCountLabel = document.getElementById('charCount');
  
  function updateCharCount() {
    var len = textarea.value.length;
    charCountLabel.textContent = toPersianNum(len) + ' / ' + toPersianNum(1000);
    if (len > 900) charCountLabel.style.color = '#e74c3c';
    else charCountLabel.style.color = '#64748b';
  }

  var draft = localStorage.getItem('journalDraft');
  if (draft) {
    textarea.value = draft;
    updateCharCount();
  }

  textarea.addEventListener('input', function() {
    localStorage.setItem('journalDraft', this.value);
    updateCharCount();
  });

  // احراز هویت
  supabaseClient.auth.getUser().then(function(res) {
    if (!res.data.user) { window.location.href = 'login.html'; return; }
    myUid = res.data.user.id;
    
    supabaseClient.from('profiles').select('username').eq('id', myUid).single().then(function(p) {
      if (p.data) {
        document.querySelector('.user-name').textContent = p.data.username;
        document.querySelector('.avatar').textContent = p.data.username.charAt(0);
      }
    });

    loadJournals();
  });

  window.selectMood = function(el) {
    document.querySelectorAll('.mood-item').forEach(function(m) { m.classList.remove('selected'); });
    el.classList.add('selected');
    currentSelectedMood = el.getAttribute('data-mood');
  };

  document.querySelector('.mood-item[data-mood="🙂"]').classList.add('selected');

  window.saveJournal = function() {
    var text = textarea.value.trim();
    var msg = document.getElementById('journalMsg');
    var saveBtn = document.getElementById('saveBtn');

    if (text.length < 5) { msg.textContent = 'یه کم بیشتر بنویس!'; msg.style.color = '#e74c3c'; return; }
    
    msg.textContent = 'در حال ذخیره...'; 
    msg.style.color = '#94a3b8';
    saveBtn.disabled = true; 

    if (editingEntryId) {
      supabaseClient.from('user_journals').update({ text: text, mood: currentSelectedMood, updated_at: new Date().toISOString() }).eq('id', editingEntryId).then(function(res) {
        saveBtn.disabled = false;
        if (res.error) { msg.textContent = 'خطا: ' + res.error.message; msg.style.color = '#e74c3c'; return; }
        msg.textContent = '✅ ویرایش شد!'; 
        msg.style.color = '#10b981';
        clearForm();
        loadJournals();
      });
    } else {
      supabaseClient.from('user_journals').insert({ user_id: myUid, text: text, mood: currentSelectedMood }).then(function(res) {
        saveBtn.disabled = false;
        if (res.error) { msg.textContent = 'خطا: ' + res.error.message; msg.style.color = '#e74c3c'; return; }
        msg.textContent = '✅ ثبت شد!'; 
        msg.style.color = '#10b981';
        clearForm();
        loadJournals();
      });
    }
  };

  function clearForm() {
    textarea.value = '';
    editingEntryId = null;
    currentSelectedMood = '🙂';
    localStorage.removeItem('journalDraft'); 
    document.querySelectorAll('.mood-item').forEach(function(m) { m.classList.remove('selected'); });
    document.querySelector('.mood-item[data-mood="🙂"]').classList.add('selected');
    updateCharCount();
  }

  function loadJournals() {
    var box = document.getElementById('pastEntries');
    
    supabaseClient.from('user_journals').select('*').eq('user_id', myUid).order('created_at', { ascending: false }).limit(20).then(function(res) {
      box.innerHTML = '<h3>📖 خاطرات قبلی من:</h3>';
      
      if (res.error) {
        box.innerHTML += '<p class="lock-note" style="color:#e74c3c;">خطا در دریافت خاطرات. سوپابیس در دسترس نیست.</p>';
        return;
      }

      allJournals = res.data || []; 
      
      if (allJournals.length === 0) { 
        box.innerHTML += '<p class="lock-note">هنوز خاطره‌ای ننوشتی.</p>'; 
        document.getElementById('moodStats').style.display = 'none';
        return; 
      }

      renderMoodStats(allJournals); 

      allJournals.forEach(function(j) {
        var div = document.createElement('div');
        div.className = 'entry-card';
        
        var dt = new Intl.DateTimeFormat('fa-IR', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }).format(new Date(j.created_at));
        
        var header = document.createElement('div');
        header.className = 'entry-header';
        header.innerHTML = `<span class="entry-date">${dt}</span><span class="entry-mood">${j.mood || '🙂'}</span>`;
        
        var textDiv = document.createElement('div');
        textDiv.className = 'entry-text';
        textDiv.textContent = j.text; 
        
        var btnDiv = document.createElement('div');
        btnDiv.style = 'margin-top: 15px; text-align: left; display: flex; gap: 8px; justify-content: flex-end;';
        btnDiv.innerHTML = `
          <button class="btn-dim" onclick="editJournal('${j.id}')">✏️ ویرایش</button>
          <button class="btn-dim" style="color:#ef4444;" onclick="deleteJournal('${j.id}')">🗑️ حذف</button>
        `;

        div.appendChild(header);
        div.appendChild(textDiv);
        div.appendChild(btnDiv);
        box.appendChild(div);
      });
    });
  }

  function renderMoodStats(journals) {
    var statsBox = document.getElementById('moodStats');
    statsBox.style.display = 'flex';
    statsBox.innerHTML = '';

    var moods = ['😄', '🙂', '😐', '😔', '😡'];
    var counts = { '😄': 0, '🙂': 0, '😐': 0, '😔': 0, '😡': 0 };
    var total = journals.length;

    journals.forEach(function(j) {
      if (counts[j.mood] !== undefined) counts[j.mood]++;
    });

    moods.forEach(function(mood) {
      var percent = total > 0 ? (counts[mood] / total) * 100 : 0;
      if (percent === 0) return;

      var item = document.createElement('div');
      item.className = 'mood-stat-item';
      item.innerHTML = `
        <span style="font-size: 1.3rem; margin-bottom: 4px;">${mood}</span>
        <div class="mood-stat-bar-wrapper">
          <div class="mood-stat-bar" style="width: ${percent}%;"></div>
        </div>
        <span class="mood-stat-label">${toPersianNum(Math.round(percent))}٪</span>
      `;
      statsBox.appendChild(item);
    });
  }

  window.editJournal = function(id) {
    var journal = allJournals.find(function(j) { return j.id === id; });
    if (!journal) return;

    editingEntryId = id;
    textarea.value = journal.text;
    currentSelectedMood = journal.mood || '🙂';
    updateCharCount();
    
    document.querySelectorAll('.mood-item').forEach(function(m) { m.classList.remove('selected'); });
    var moodEl = document.querySelector('.mood-item[data-mood="' + currentSelectedMood + '"]');
    if (moodEl) moodEl.classList.add('selected');
    
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  window.deleteJournal = function(id) {
    if (confirm('این خاطره حذف بشه؟')) {
      supabaseClient.from('user_journals').delete().eq('id', id).then(function(res) { 
        if(!res.error) loadJournals(); 
      });
    }
  };
</script>
</body>
</html>
