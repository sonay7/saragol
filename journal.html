<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دفترچه خاطرات | ساراگل</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .journal-container { background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; padding: 20px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    .journal-date { text-align: center; font-size: 0.9rem; color: var(--text-dim); margin-bottom: 16px; font-weight: bold; }
    
    .mood-selector { display: flex; justify-content: space-around; margin-bottom: 16px; background: var(--bg); padding: 10px; border-radius: 12px; border: 1px solid var(--border); }
    .mood-item { font-size: 1.8rem; cursor: pointer; transition: 0.2s; opacity: 0.4; filter: grayscale(1); }
    .mood-item:hover { transform: scale(1.2); opacity: 1; filter: grayscale(0); }
    .mood-item.selected { opacity: 1; filter: grayscale(0); transform: scale(1.2); }

    .journal-textarea { width: 100%; min-height: 150px; padding: 16px; border-radius: 14px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-family: inherit; font-size: 1rem; line-height: 1.8; resize: vertical; box-sizing: border-box; }
    .journal-textarea:focus { outline: none; border-color: var(--green); }

    .past-entries { margin-top: 30px; }
    .entry-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
    .entry-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-bottom: 1px dashed var(--border); padding-bottom: 8px; }
    .entry-date { font-size: 0.8rem; color: var(--text-dim); }
    .entry-mood { font-size: 1.5rem; }
    .entry-text { font-size: 0.95rem; line-height: 1.8; white-space: pre-wrap; } /* white-space: pre-wrap خطوط جدید رو حفظ میکنه */

    /* استایل برای نمودار حال و هوا */
    .mood-stats-container { display: flex; gap: 10px; justify-content: space-between; margin-bottom: 20px; background: var(--bg-card); padding: 15px; border-radius: 12px; border: 1px solid var(--border); flex-wrap: wrap;}
    .mood-stat-item { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; min-width: 50px; }
    .mood-stat-bar-wrapper { width: 100%; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
    .mood-stat-bar { height: 100%; background: var(--green); border-radius: 4px; transition: width 0.5s ease; }
    .mood-stat-label { font-size: 0.7rem; color: var(--text-dim); }
  </style>
</head>
<body>

<header class="header">
  <div class="logo">ساراگل</div>
  <div class="user-area">
    <span class="user-name">—</span>
    <div class="avatar">—</div>
  </div>
</header>

<main class="container">
  <h2 style="text-align: center; margin-bottom: 20px;">📔 دفترچه خاطرات</h2>

  <!-- بخش آمار حال و هوا -->
  <div id="moodStats" class="mood-stats-container" style="display: none;">
    <!-- توسط جاوااسکریپت پر میشه -->
  </div>
  
  <div class="journal-container">
    <div class="journal-date" id="todayDate"></div>
    
    <div class="mood-selector" id="moodSelector">
      <span class="mood-item" data-mood="😄" onclick="selectMood(this)">😄</span>
      <span class="mood-item" data-mood="🙂" onclick="selectMood(this)">🙂</span>
      <span class="mood-item" data-mood="😐" onclick="selectMood(this)">😐</span>
      <span class="mood-item" data-mood="😔" onclick="selectMood(this)">😔</span>
      <span class="mood-item" data-mood="😡" onclick="selectMood(this)">😡</span>
    </div>

    <textarea id="journalText" class="journal-textarea" placeholder="امروز چه خبر؟ هر چیزی که دلت می‌خواد بنویس..."></textarea>
    
    <button onclick="saveJournal()" id="saveBtn" class="btn btn-green btn-full" style="margin-top: 12px;">💾 ثبت خاطره</button>
    <p id="journalMsg" style="text-align: center; font-size: 0.85rem; margin-top: 8px;"></p>
  </div>

  <div class="past-entries" id="pastEntries">
    <h3 style="font-size: 1rem; margin-bottom: 12px;">📖 خاطرات قبلی من:</h3>
    <p class="lock-note">در حال بارگذاری...</p>
  </div>
</main>

<nav class="bottom-nav">
  <a href="index.html" class="nav-item">🏠 خانه</a>
  <a href="study.html" class="nav-item">⏱ مطالعه</a>
  <a href="journal.html" class="nav-item active">📔 خاطرات</a>
  <a href="shop.html" class="nav-item">🛒 فروشگاه</a>
  <a href="profile.html" class="nav-item">👤 پروفایل</a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="auth.js"></script>
<script src="theme.js"></script>
<script>
  var myUid = null;
  var currentSelectedMood = '🙂';
  var editingEntryId = null;
  var allJournals = []; // برای نگه داشتن دیتا و جلوگیری از باگ دکمه ویرایش

  // تنظیم تاریخ امروز
  var today = new Date();
  document.getElementById('todayDate').textContent = new Intl.DateTimeFormat('fa-IR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }).format(today);

  // --- ذخیره خودکار (Autosave) ---
  var textarea = document.getElementById('journalText');
  
  // لود کردن متن ذخیره شده (اگر کاربر قبلا تایپ کرده و صفحه رو بسته)
  var draft = localStorage.getItem('journalDraft');
  if (draft) {
    textarea.value = draft;
  }

  // ذخیره متن با هر بار تایپ کردن
  textarea.addEventListener('input', function() {
    localStorage.setItem('journalDraft', this.value);
  });

  // --- احراز هویت و لود اولیه ---
  supabaseClient.auth.getUser().then(function(res) {
    if (!res.data.user) { window.location.href = 'login.html'; return; }
    myUid = res.data.user.id;
    
    supabaseClient.from('profiles').select('username').eq('id', myUid).single().then(function(p) {
      if (p.data) {
        document.querySelector('.user-name').textContent = p.data.username;
        document.querySelector('.avatar').textContent = p.data.username.charAt(0);
      }
    });

    loadJournals();
  });

  window.selectMood = function(el) {
    document.querySelectorAll('.mood-item').forEach(function(m) { m.classList.remove('selected'); });
    el.classList.add('selected');
    currentSelectedMood = el.getAttribute('data-mood');
  };

  // انتخاب پیش‌فرض
  document.querySelector('.mood-item[data-mood="🙂"]').classList.add('selected');

  // --- ذخیره خاطره (جدید یا ویرایش) ---
  window.saveJournal = function() {
    var text = textarea.value.trim();
    var msg = document.getElementById('journalMsg');
    var saveBtn = document.getElementById('saveBtn');

    if (text.length < 5) { msg.textContent = 'یه کم بیشتر بنویس!'; msg.style.color = '#e74c3c'; return; }
    
    msg.textContent = 'در حال ذخیره...'; 
    msg.style.color = 'var(--text-dim)';
    saveBtn.disabled = true; // غیرفعال کردن دکمه تا زمانی که عملیات تموم بشه

    if (editingEntryId) {
      // ویرایش
      supabaseClient.from('user_journals').update({ text: text, mood: currentSelectedMood, updated_at: new Date().toISOString() }).eq('id', editingEntryId).then(function(res) {
        saveBtn.disabled = false;
        if (res.error) { msg.textContent = 'خطا: ' + res.error.message; msg.style.color = '#e74c3c'; return; }
        
        msg.textContent = '✅ ویرایش شد!'; 
        msg.style.color = 'var(--green)';
        clearForm();
        loadJournals();
      });
    } else {
      // ثبت جدید
      supabaseClient.from('user_journals').insert({ user_id: myUid, text: text, mood: currentSelectedMood }).then(function(res) {
        saveBtn.disabled = false;
        if (res.error) { msg.textContent = 'خطا: ' + res.error.message; msg.style.color = '#e74c3c'; return; }
        
        msg.textContent = '✅ ثبت شد!'; 
        msg.style.color = 'var(--green)';
        clearForm();
        loadJournals();
      });
    }
  };

  function clearForm() {
    textarea.value = '';
    editingEntryId = null;
    currentSelectedMood = '🙂';
    localStorage.removeItem('journalDraft'); // پاک کردن ذخیره خودکار بعد از ثبت موفق
    document.querySelectorAll('.mood-item').forEach(function(m) { m.classList.remove('selected'); });
    document.querySelector('.mood-item[data-mood="🙂"]').classList.add('selected');
  }

  // --- لود کردن خاطرات و ساخت نمودار ---
  function loadJournals() {
    var box = document.getElementById('pastEntries');
    
    // محدودیت 20 تایی برای جلوگیری از کندی سایت
    supabaseClient.from('user_journals').select('*').eq('user_id', myUid).order('created_at', { ascending: false }).limit(20).then(function(res) {
      box.innerHTML = '<h3 style="font-size: 1rem; margin-bottom: 12px;">📖 خاطرات قبلی من:</h3>';
      
      if (res.error) {
        box.innerHTML += '<p class="lock-note" style="color:#e74c3c;">خطا در دریافت خاطرات. سوپابیس در دسترس نیست.</p>';
        return;
      }

      allJournals = res.data || []; // ذخیره دیتا برای استفاده در دکمه ویرایش
      
      if (allJournals.length === 0) { 
        box.innerHTML += '<p class="lock-note">هنوز خاطره‌ای ننوشتی.</p>'; 
        document.getElementById('moodStats').style.display = 'none';
        return; 
      }

      renderMoodStats(allJournals); // ساخت نمودار حال و هوا

      allJournals.forEach(function(j) {
        var div = document.createElement('div');
        div.className = 'entry-card';
        
        var dt = new Intl.DateTimeFormat('fa-IR', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }).format(new Date(j.created_at));
        
        // ساخت المان‌ها به صورت امن (جلوگیری از XSS)
        var header = document.createElement('div');
        header.className = 'entry-header';
        header.innerHTML = `<span class="entry-date">${dt}</span><span class="entry-mood">${j.mood || '🙂'}</span>`;
        
        var textDiv = document.createElement('div');
        textDiv.className = 'entry-text';
        textDiv.textContent = j.text; // متن به صورت خام و امن قرار میگیره
        
        var btnDiv = document.createElement('div');
        btnDiv.style = 'margin-top: 10px; text-align: left;';
        btnDiv.innerHTML = `
          <button class="btn btn-dim btn-sm" onclick="editJournal('${j.id}')">✏️ ویرایش</button>
          <button class="btn btn-dim btn-sm" style="color:#e74c3c;" onclick="deleteJournal('${j.id}')">🗑️</button>
        `;

        div.appendChild(header);
        div.appendChild(textDiv);
        div.appendChild(btnDiv);
        box.appendChild(div);
      });
    });
  }

  // --- ساخت نمودار حال و هوا ---
  function renderMoodStats(journals) {
    var statsBox = document.getElementById('moodStats');
    statsBox.style.display = 'flex';
    statsBox.innerHTML = '';

    var moods = ['😄', '🙂', '😐', '😔', '😡'];
    var counts = { '😄': 0, '🙂': 0, '😐': 0, '😔': 0, '😡': 0 };
    var total = journals.length;

    journals.forEach(function(j) {
      if (counts[j.mood] !== undefined) counts[j.mood]++;
    });

    moods.forEach(function(mood) {
      var percent = total > 0 ? (counts[mood] / total) * 100 : 0;
      if (percent === 0) return; // اگه صفر بود نشون نده

      var item = document.createElement('div');
      item.className = 'mood-stat-item';
      item.innerHTML = `
        <span style="font-size: 1.2rem;">${mood}</span>
        <div class="mood-stat-bar-wrapper">
          <div class="mood-stat-bar" style="width: ${percent}%;"></div>
        </div>
        <span class="mood-stat-label">${Math.round(percent)}٪</span>
      `;
      statsBox.appendChild(item);
    });
  }

  // --- ویرایش (رفع باگ) ---
  window.editJournal = function(id) {
    var journal = allJournals.find(function(j) { return j.id === id; });
    if (!journal) return;

    editingEntryId = id;
    textarea.value = journal.text;
    currentSelectedMood = journal.mood || '🙂';
    
    document.querySelectorAll('.mood-item').forEach(function(m) { m.classList.remove('selected'); });
    var moodEl = document.querySelector('.mood-item[data-mood="' + currentSelectedMood + '"]');
    if (moodEl) moodEl.classList.add('selected');
    
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  window.deleteJournal = function(id) {
    if (confirm('این خاطره حذف بشه؟')) {
      supabaseClient.from('user_journals').delete().eq('id', id).then(function(res) { 
        if(!res.error) loadJournals(); 
      });
    }
  };
</script>
</body>
</html>
