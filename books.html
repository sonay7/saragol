<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>انجمن کتاب‌خوانی | مدرسه‌ی ما</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .bookshelf-container { background: #3e2723; padding: 20px 15px 15px; border-radius: 8px; box-shadow: inset 0 10px 20px rgba(0,0,0,0.5), 0 10px 20px rgba(0,0,0,0.4); margin-top: 20px; display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; min-height: 180px; border-bottom: 15px solid #2d1a17; position: relative; }
    .bookshelf-container::before { content: ''; position: absolute; top: 10px; left: 10px; right: 10px; height: 5px; background: rgba(0,0,0,0.3); border-radius: 5px; }
    .real-book { width: 70px; height: 110px; position: relative; cursor: pointer; transition: transform 0.3s ease, box-shadow 0.3s ease; border-radius: 4px; box-shadow: -2px 2px 5px rgba(0,0,0,0.5); animation: popIntoPlace 0.5s ease-out; }
    @keyframes popIntoPlace { 0% { opacity: 0; transform: scale(0.5) translateY(-50px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
    .real-book:hover { transform: translateY(-10px) rotate(-2deg); box-shadow: -5px 5px 15px rgba(0,0,0,0.6); z-index: 2; }
    .real-book img { width: 100%; height: 100%; object-fit: cover; border-radius: 4px; }
    .book-title-tooltip { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.85); color: white; font-size: 0.65rem; padding: 4px; text-align: center; border-radius: 0 0 4px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .delete-book-btn { position: absolute; top: -6px; right: -6px; background: #e74c3c; color: white; border: none; border-radius: 50%; width: 22px; height: 22px; font-size: 14px; cursor: pointer; display: none; z-index: 3; line-height: 1; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
    .real-book:hover .delete-book-btn { display: block; }

    #tab-chat { height: calc(100vh - 160px); background: #17212b; border-radius: 16px; overflow: hidden; }
    #chatBox { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; height: 100%; }
    .chat-msg { max-width: 85%; padding: 8px 12px; border-radius: 12px; font-size: 0.9rem; line-height: 1.5; word-wrap: break-word; position: relative; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
    .chat-msg.me { align-self: flex-end; background: #2b5278; color: white; border-bottom-right-radius: 4px; }
    .chat-msg.other { align-self: flex-start; background: #182533; color: white; border-bottom-left-radius: 4px; }
    .chat-msg .sender { font-size: 0.75rem; color: #64b5f6; margin-bottom: 4px; font-weight: bold; display: block; }
    .chat-input-area { padding: 12px; background: #17212b; border-top: 1px solid #0e1621; display: flex; gap: 8px; align-items: center; }
    .chat-input-area input { flex: 1; padding: 12px 16px; border-radius: 24px; border: none; background: #242f3d; color: white; font-family: inherit; outline: none; }
    .chat-input-area button { background: #64b5f6; color: #17212b; border: none; border-radius: 50%; width: 45px; height: 45px; display: flex; justify-content: center; align-items: center; font-size: 1.2rem; cursor: pointer; }
    .sticker-btn { background: transparent !important; color: var(--text) !important; font-size: 1.5rem !important; width: auto !important; height: auto !important; padding: 0 8px !important; }

    .progress-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .progress-bar-bg { width: 100%; height: 12px; background: var(--border); border-radius: 10px; margin: 10px 0; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--green), var(--blue)); border-radius: 10px; transition: width 0.5s ease; }
    .progress-stats { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-dim); margin-bottom: 8px; }
    .estim { font-size: 0.85rem; color: var(--blue); margin-bottom: 12px; background: rgba(52, 152, 219, 0.1); padding: 8px; border-radius: 8px; }
    .update-form { display: flex; gap: 8px; margin-top: 10px; }
    .update-form input { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-family: inherit; }
  </style>
</head>
<body>

  <header class="header">
    <div class="logo">مدرسه‌ی ما</div>
    <div class="user-area">
      <span class="user-name">—</span>
      <div class="avatar">—</div>
    </div>
  </header>

  <main class="container">

    <div class="tabs" style="margin-bottom: 20px; overflow-x: auto; white-space: nowrap;">
      <button class="tab active" data-book-tab="tab-chat">💬 گفتگو</button>
      <button class="tab" data-book-tab="tab-progress">📈 ردیاب مطالعه</button>
      <button class="tab" data-book-tab="tab-shelf">📚 قفسه کتاب</button>
      <button class="tab" data-book-tab="tab-loan">🤝 امانت</button>
    </div>

    <!-- تب چت -->
    <section id="tab-chat" class="tab-content" style="display: flex; flex-direction: column;">
      <div id="chatBox"><p class="lock-note" style="text-align: center; margin-top: 20px;">در حال بارگذاری...</p></div>
      <div class="chat-input-area">
        <button type="button" class="sticker-btn" onclick="openStickerPicker('book_chat', 'chatInput', 'chatSendBtn')">😀</button>
        <input id="chatInput" type="text" placeholder="پیامی بنویس...">
        <button id="chatSendBtn">➤</button>
      </div>
    </section>

    <!-- تب ردیاب مطالعه -->
    <section id="tab-progress" class="tab-content hidden">
      <h2>📈 ردیاب مطالعه</h2>
      <div style="background: var(--bg-card); padding: 16px; border-radius: 12px; margin-bottom: 20px;">
        <p style="font-size: 0.85rem; margin-bottom: 10px;">کتاب جدیدی رو شروع کردی؟</p>
        <input id="newBookTitle" type="text" class="input" placeholder="اسم کتاب">
        <div style="display: flex; gap: 8px; margin-top: 8px;">
          <input id="newBookTotalPages" type="number" class="input" placeholder="کل صفحات">
          <input id="newBookPagesPerDay" type="number" class="input" placeholder="روزی چند صفحه؟">
        </div>
        <button id="addProgressBtn" class="btn btn-blue btn-full" style="margin-top: 10px;">شروع مطالعه</button>
      </div>
      <div id="progressList"></div>
    </section>

    <!-- تب قفسه کتاب -->
    <section id="tab-shelf" class="tab-content hidden">
      <h2>📚 قفسه کتاب (کتاب‌های تموم‌شده)</h2>
      <div id="shelfLocked" class="lock-note">🔒 قفسه کتاب از سطح ۲ باز می‌شه.</div>
      <div id="shelfUnlocked" class="hidden">
        <div style="background: var(--bg-card); padding: 16px; border-radius: 12px; margin-bottom: 20px;">
          <p style="font-size: 0.85rem; margin-bottom: 10px;">یه کتاب تموم‌شده به قفسه اضافه کن:</p>
          <input id="bookTitle" type="text" class="input" placeholder="اسم کتاب">
          <input id="bookImage" type="file" accept="image/*" class="input" style="margin-top: 8px; padding: 8px;">
          <button id="addBookBtn" class="btn btn-green btn-full" style="margin-top: 10px;">افزودن به قفسه</button>
        </div>
        <div id="myShelfList"></div>
      </div>
    </section>

    <!-- تب امانت -->
    <section id="tab-loan" class="tab-content hidden">
      <h2>🤝 امانت کتاب</h2>
      <div style="background: var(--bg-card); padding: 16px; border-radius: 12px; margin-bottom: 20px;">
        <input id="loanTitle" type="text" class="input" placeholder="اسم کتابی که می‌خوای امانت بدی">
        <button id="addLoanBtn" class="btn btn-blue btn-full" style="margin-top: 10px;">ثبت برای امانت</button>
      </div>
      <div id="loanList"></div>
    </section>

  </main>
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">🏠 خانه</a>
    <a href="study.html" class="nav-item">⏱ مطالعه</a>
    <a href="books.html" class="nav-item active">📚 کتاب‌خوانی</a>
    <a href="admin.html" class="nav-item">🛠 ادمین</a>
    <a href="profile.html" class="nav-item">👤 پروفایل</a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="auth.js"></script>
  <script src="notifications.js"></script>
  <script src="theme.js"></script>
  <script src="stickers.js"></script>
  <script src="books.js"></script>
</body>
</html>
