<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سوالات متداول | ساراگل</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .faq-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 12px;
      overflow: hidden;
      transition: all 0.3s ease;
    }
    .faq-item[open] {
      border-color: var(--green);
      box-shadow: 0 4px 15px rgba(46, 204, 113, 0.1);
    }
    .faq-question {
      padding: 16px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text);
    }
    .faq-question::after {
      content: '▼';
      font-size: 0.7rem;
      color: var(--text-dim);
      transition: transform 0.3s;
    }
    .faq-item[open] .faq-question::after {
      transform: rotate(180deg);
      color: var(--green);
    }
    .faq-answer {
      padding: 0 16px 16px 16px;
      font-size: 0.9rem;
      line-height: 1.8;
      color: var(--text-dim);
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }
    .faq-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .faq-header h2 {
      font-size: 1.4rem;
      margin-bottom: 8px;
    }
    .faq-header p {
      font-size: 0.85rem;
      color: var(--text-dim);
    }
  </style>
</head>
<body>

<header class="header">
  <div class="logo">ساراگل</div>
  <div class="user-area">
    <span class="user-name">—</span>
    <div class="avatar">—</div>
  </div>
</header>

<main class="container">
  <div class="faq-header">
    <h2>❓ سوالات متداول</h2>
    <p>جواب سوال‌های پرتکرار رو اینجا پیدا کن</p>
  </div>

  <div id="faqList">
    <p class="lock-note">در حال بارگذاری...</p>
  </div>

  <div style="margin-top: 24px; background: var(--bg-card); border: 1px dashed var(--border); border-radius: 14px; padding: 20px; text-align: center;">
    <p style="font-size: 0.9rem; margin-bottom: 12px;">جواب سوالت رو پیدا نکردی؟</p>
    <a href="https://t.me/Aysonaizadi" target="_blank" class="btn btn-blue btn-full">📱 پیام به ادمین</a>
  </div>
</main>

<nav class="bottom-nav">
  <a href="index.html" class="nav-item">🏠 خانه</a>
  <a href="study.html" class="nav-item">⏱ مطالعه</a>
  <a href="faq.html" class="nav-item active">❓ راهنما</a>
  <a href="shop.html" class="nav-item">🛒 فروشگاه</a>
  <a href="profile.html" class="nav-item">👤 پروفایل</a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="auth.js"></script>
  <script src="notifications.js"></script>
<script src="theme.js"></script>

<script>
  supabaseClient.auth.getUser().then(function(res) {
    if (!res.data.user) { window.location.href = 'login.html'; return; }
    supabaseClient.from('profiles').select('username').eq('id', res.data.user.id).single().then(function(p) {
      if (p.data) {
        document.querySelector('.user-name').textContent = p.data.username;
        document.querySelector('.avatar').textContent = p.data.username.charAt(0);
      }
    });
    loadFaq();
  });

  function loadFaq() {
    var list = document.getElementById('faqList');
    
    supabaseClient.from('faq_questions')
      .select('*')
      .eq('is_active', true)
      .order('sort_order', { ascending: true })
      .then(function(res) {
        list.innerHTML = '';
        var rows = res.data || [];
        
        if (rows.length === 0) {
          list.innerHTML = '<p class="lock-note">هنوز سوالی ثبت نشده.</p>';
          return;
        }

        rows.forEach(function(faq) {
          var item = document.createElement('details');
          item.className = 'faq-item';
          
          item.innerHTML = `
            <summary class="faq-question">${faq.question}</summary>
            <div class="faq-answer">${faq.answer}</div>
          `;
          
          list.appendChild(item);
        });
      });
  }
</script>
</body>
</html>
