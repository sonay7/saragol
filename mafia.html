<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مافیا | ساراگل</title>
<link rel="stylesheet" href="style.css">
<style>
.mafia-card{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
.mafia-btn{background:var(--green);color:#fff;border:none;padding:12px 20px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:1rem;width:100%;margin-top:8px}
.mafia-btn:disabled{opacity:.5;cursor:not-allowed}
.danger{background:#e74c3c}.blue{background:var(--blue)}.gold{background:#f1c40f;color:#000}.purple{background:#9b59b6}
.mafia-input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-family:inherit;margin-top:8px;box-sizing:border-box}
.m-players{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.m-player{background:var(--bg);border:1px solid var(--border);padding:8px 12px;border-radius:20px;font-size:.85rem}
.m-player.dead{opacity:.4;text-decoration:line-through}
.m-player.self{border-color:var(--green)}
.m-player.deputy{border-color:#f1c40f}
.m-chat{max-height:250px;overflow-y:auto;background:var(--bg);border-radius:10px;padding:12px;margin-top:12px}
.m-msg{margin-bottom:6px;font-size:.85rem;line-height:1.5}
.m-msg strong{color:var(--green)}
.phase-day{background:rgba(241,196,15,.15);color:#f1c40f}
.phase-night{background:rgba(155,89,182,.15);color:#9b59b6}
.phase-voting{background:rgba(231,76,60,.15);color:#e74c3c}
.phase-res{background:rgba(46,204,113,.15);color:#2ecc71}
.phase-bar{text-align:center;font-size:1.3rem;font-weight:bold;padding:14px;border-radius:10px;margin-bottom:12px}
.flip-card{background:transparent;width:230px;height:320px;perspective:1000px;margin:20px auto;cursor:pointer}
.flip-inner{position:relative;width:100%;height:100%;transition:transform .8s;transform-style:preserve-3d}
.flip-card.flipped .flip-inner{transform:rotateY(180deg)}
.flip-front,.flip-back{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:20px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;box-sizing:border-box}
.flip-front{background:linear-gradient(135deg,#1a1a2e,#16213e);border:2px solid #e74c3c;color:#fff}
.flip-back{background:linear-gradient(135deg,#2c3e50,#000);border:2px solid #f1c40f;color:#fff;transform:rotateY(180deg)}
.flip-back h2{color:#f1c40f;font-size:1.8rem;margin-bottom:10px;text-align:center}
.flip-back p{font-size:.9rem;line-height:1.6;color:#ddd;text-align:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;justify-content:center;align-items:center;z-index:9999;padding:20px}
.modal.hidden{display:none}
.modal-box{background:var(--bg-card);border:2px solid var(--green);border-radius:16px;padding:24px;max-width:400px;width:100%;text-align:center}
.modal-box h3{font-size:1.2rem;margin-bottom:16px;color:var(--text)}
.target-list{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px;max-height:200px;overflow-y:auto}
.target-btn{background:var(--bg);color:var(--text);border:1px solid var(--border);padding:10px 16px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:.9rem}
.target-btn:hover{border-color:var(--green)}
.sticker-btn{background:transparent!important;color:var(--text)!important;font-size:1.3rem!important;width:auto!important;height:auto!important;padding:0 8px!important;margin:0!important}
.chat-area{display:flex;gap:8px;align-items:center}
.badge-icon{display:inline-block;margin-right:4px}
</style>
</head>
<body>
<header class="header"><div class="logo">ساراگل</div><div class="user-area"><span class="user-name">—</span><div class="avatar">—</div></div></header>

<main class="container">
<div id="lobbyView">
  <div class="mafia-card">
    <h2>🎭 مافیا</h2>
    <p style="font-size:.85rem;color:var(--text-dim);margin-top:8px;">این بازی دقیقاً با <strong>۱۲ نفر</strong> شروع می‌شه.</p>
    <button class="mafia-btn" id="createRoomBtn" style="display:none;">➕ ساخت اتاق (ادمین)</button>
    <input class="mafia-input" id="joinCode" placeholder="کد اتاق" maxlength="6">
    <button class="mafia-btn blue" id="joinRoomBtn">🚪 ورود به اتاق</button>
  </div>
</div>

<div id="gameView" class="hidden">
  <div class="phase-bar" id="phaseBar">...</div>
  <div class="mafia-card">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <strong>اتاق: <span id="roomCode"></span></strong>
      <button class="mafia-btn danger" style="width:auto;padding:6px 12px;font-size:.8rem;margin:0;" onclick="location.reload()">خروج</button>
    </div>
    <button id="hostBtn" class="mafia-btn gold" style="display:none;margin-top:10px;" onclick="hostAdvance()">▶ مرحله بعد</button>
    <button id="soundToggle" class="mafia-btn" style="width:auto;padding:6px 12px;font-size:.8rem;margin-top:8px;display:none;" onclick="toggleSound()">🔊 صدا: روشن</button>
  </div>
  
  <div id="roleCardWrap" style="display:none;">
    <div class="flip-card" onclick="this.classList.toggle('flipped')">
      <div class="flip-inner">
        <div class="flip-front"><div style="font-size:3rem;">🎭</div><p style="margin-top:12px;">برای دیدن نقش کلیک کن</p><p style="color:#e74c3c;font-size:.75rem;margin-top:8px;">⚠️ کسی نبینه!</p></div>
        <div class="flip-back"><h2 id="roleName">-</h2><p id="roleDesc">-</p></div>
      </div>
    </div>
  </div>
  
  <div class="mafia-card">
    <h3>بازیکنان (<span id="playerCount">0</span>/۱۲):</h3>
    <div class="m-players" id="playersList"></div>
  </div>
  
  <div id="mafiaChatCard" class="mafia-card" style="display:none;">
    <h3>🐺 چت مافیا (مخفی)</h3>
    <div class="m-chat" id="mafiaChat"></div>
    <div class="chat-area"><input class="mafia-input" id="mafiaChatInput" placeholder="پیام..." style="margin:0;"><button class="mafia-btn" style="width:auto;margin:0;padding:10px 14px;" onclick="sendChat('mafia')">➤</button></div>
  </div>
  
  <div id="helperChatCard" class="mafia-card" style="display:none;">
    <h3>🤝 اتاق مشورت یاور</h3>
    <div class="m-chat" id="helperChat"></div>
    <div class="chat-area"><input class="mafia-input" id="helperChatInput" placeholder="پیام..." style="margin:0;"><button class="mafia-btn" style="width:auto;margin:0;padding:10px 14px;" onclick="sendChat('helper')">➤</button></div>
  </div>
  
  <div id="publicChatCard" class="mafia-card" style="display:none;">
    <h3>💬 چت روز</h3>
    <div class="m-chat" id="publicChat"></div>
    <div class="chat-area">
      <button class="sticker-btn" onclick="openStickerPicker('mafia_messages','publicChatInput','sendPublicBtn')">😀</button>
      <input class="mafia-input" id="publicChatInput" placeholder="پیام..." style="margin:0;">
      <button class="mafia-btn" id="sendPublicBtn" style="width:auto;margin:0;padding:10px 14px;" onclick="sendChat('public')">➤</button>
    </div>
  </div>
</div>
</main>

<div id="yesNoModal" class="modal hidden">
  <div class="modal-box">
    <h3 id="ynQuestion"></h3>
    <button class="mafia-btn" onclick="ynYes()">✅ بله</button>
    <button class="mafia-btn danger" onclick="ynNo()">❌ خیر</button>
  </div>
</div>

<div id="targetModal" class="modal hidden">
  <div class="modal-box">
    <h3 id="tgtTitle">یک نفر رو انتخاب کن</h3>
    <div class="target-list" id="tgtList"></div>
    <button class="mafia-btn" style="margin-top:12px;" onclick="closeTarget()">انصراف</button>
  </div>
</div>

  <a href="study.html" class="nav-item">⏱ مطالعه</a>

<audio id="bgMusic" loop style="display:none;"></audio>
<audio id="sfx" style="display:none;"></audio>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="auth.js"></script>
<script src="theme.js"></script>
<script src="stickers.js"></script>

<script>
const MIN_PLAYERS = 12;
const ROLE_NAMES = {godfather:'پدرخوانده',natasha:'ناتاشا',mafia:'مافیای ساده',citizen:'شهروند ساده',doctor:'دکتر',detective:'کارآگاه',mayor:'شهردار',sniper:'تیرانداز',gunner:'تفنگدار',helper:'یاور'};
const ROLE_DESCS = {
  godfather:'رئیس مافیا. از استعلام کارآگاه در امانی. تصمیم نهایی قتل با توئه.',
  natasha:'عضو مافیا. هر شب یکی رو ساکت می‌کنی. اگه پدرخوانده بمیره، تو رئیس می‌شی.',
  mafia:'عضو ساده مافیا. شب با رئیس مشورت می‌کنی.',
  citizen:'هیچ قدرتی نداری. با بحث و رأی، مافیا رو پیدا کن.',
  doctor:'هر شب یک نفر (یا خودت) رو نجات بده.',
  detective:'هر شب یک نفر رو استعلام کن. پدرخوانده رو شهروند می‌بینی.',
  mayor:'یک بار در کل بازی می‌تونی رأی‌گیری رو وتو کنی.',
  sniper:'۳ تیر داری. اگه به شهروند بزنی، خودت می‌میری.',
  gunner:'۳ تیر داری. به دیگران می‌دی تا اونا شلیک کنن.',
  helper:'هر شب می‌تونی یک یار جدید اضافه کنی یا با یاران مشورت کنی.'
};

// Blocked words in public chat
const BLOCKED = ['مافیا','مافیای','پدرخوانده','ناتاشا','دکتر','کارآگاه','شهردار','تیرانداز','تفنگدار','یاور','شهروند','نجاتم داد','نجات داده','نجات داد','استعلام کردم','استعلام کرده','شلیک کردم','تیر دادم'];

const DURATIONS = {day:0,voting:30,mafia:60,doctor:30,sniper:30,helper:60,gunner:30,resolution:5};

var myUid=null, myName='', myRole='student', myRoomId=null, myPlayerId=null, myGameRole=null, isHost=false;
var myInventory=[], hasDeleteItem=false, myChatColor=null;
var pollTimer=null, tickTimer=null, phaseEndTime=null, soundOn=true;
var ynCallbackYes=null, ynCallbackNo=null;
var mafiaKillTarget=null;

// ===== Init =====
supabaseClient.auth.getUser().then(res=>{
  if(!res.data.user){window.location.href='login.html';return;}
  myUid=res.data.user.id;
  Promise.all([
    supabaseClient.from('profiles').select('username,role,chat_color').eq('id',myUid).single(),
    supabaseClient.from('user_inventory').select('*').eq('user_id',myUid)
  ]).then(r=>{
    if(r[0].data){myName=r[0].data.username;myRole=r[0].data.role;myChatColor=r[0].data.chat_color;
      document.querySelector('.user-name').textContent=myName;
      document.querySelector('.avatar').textContent=myName.charAt(0);
      if(myRole==='admin'||myRole==='superadmin')document.getElementById('createRoomBtn').style.display='block';
    }
    if(r[1].data){myInventory=r[1].data;hasDeleteItem=myInventory.some(i=>i.effect_value==='delete_message');}
  });
});

// ===== Audio =====
function playPhaseAudio(phase){
  if(!soundOn)return;
  var map={mafia:'mafia_wake',doctor:'doctor_wake',sniper:'sniper_wake',helper:'helper_wake',gunner:'gunner_wake',resolution:'morning'};
  var file=map[phase];
  if(!file)return;
  var s=document.getElementById('sfx');
  s.src='audio/'+file+'.mp3';
  s.play().catch(()=>{});
}
function startBgMusic(){
  if(!soundOn)return;
  var bg=document.getElementById('bgMusic');
  bg.src='audio/night_bg.mp3';bg.volume=.3;
  bg.play().catch(()=>{});
}
function stopBgMusic(){document.getElementById('bgMusic').pause();}
function toggleSound(){
  soundOn=!soundOn;
  document.getElementById('soundToggle').textContent=soundOn?'🔊 صدا: روشن':'🔇 صدا: خاموش';
  if(!soundOn)stopBgMusic();
}

// ===== Room =====
document.getElementById('createRoomBtn').onclick=()=>{
  var code=Math.random().toString(36).substring(2,8).toUpperCase();
  supabaseClient.from('mafia_rooms').insert({code,host_id:myUid,status:'waiting',phase:'day',day_count:1,night_phase:'mafia'}).select().single().then(r=>{
    if(r.error){alert(r.error.message);return;}
    joinRoom(r.data.id,code);
  });
};
document.getElementById('joinRoomBtn').onclick=()=>{
  var code=document.getElementById('joinCode').value.trim().toUpperCase();
  if(!code)return alert('کد رو بزن');
  supabaseClient.from('mafia_rooms').select('*').eq('code',code).single().then(r=>{
    if(r.error||!r.data)return alert('اتاق پیدا نشد');
    joinRoom(r.data.id,code);
  });
};

function joinRoom(roomId,code){
  myRoomId=roomId;
  document.getElementById('roomCode').textContent=code;
  document.getElementById('lobbyView').classList.add('hidden');
  document.getElementById('gameView').classList.remove('hidden');
  document.getElementById('soundToggle').style.display='block';

  supabaseClient.from('mafia_rooms').select('host_id').eq('id',roomId).single().then(r=>{
    if(r.data&&r.data.host_id===myUid){isHost=true;document.getElementById('hostBtn').style.display='block';}
  });
  supabaseClient.from('mafia_players').select('*').eq('room_id',roomId).eq('user_id',myUid).then(r=>{
    if(r.data&&r.data.length>0){myPlayerId=r.data[0].id;myGameRole=r.data[0].role;}
    else supabaseClient.from('mafia_players').insert({room_id:roomId,user_id:myUid,username:myName,is_alive:true}).select().single().then(ins=>{
      if(ins.data)myPlayerId=ins.data.id;
    });
  });
  pollTimer=setInterval(poll,2000);
  tickTimer=setInterval(tick,500);
  poll();
}

// ===== Poll =====
function poll(){
  if(!myRoomId)return;
  supabaseClient.from('mafia_rooms').select('*').eq('id',myRoomId).single().then(r=>{
    if(!r.data)return;
    var room=r.data;
    phaseEndTime=room.phase_end_time?new Date(room.phase_end_time):null;
    renderPhase(room);
    loadPlayers(room);
    loadRole(room);
    loadChats(room);
    if(isHost&&phaseEndTime&&Date.now()>phaseEndTime.getTime()&&room.status==='playing'){
      hostAdvance();
    }
  });
}

function tick(){
  if(!phaseEndTime)return;
  var diff=Math.max(0,Math.floor((phaseEndTime.getTime()-Date.now())/1000));
  var bar=document.getElementById('phaseBar');
  if(!bar)return;
  var name=bar.getAttribute('data-name')||'';
  bar.textContent=name+' | ⏱ '+String(Math.floor(diff/60)).padStart(2,'0')+':'+String(diff%60).padStart(2,'0');
}

// ===== Render phase =====
var lastPhaseKey='';
function renderPhase(room){
  var bar=document.getElementById('phaseBar');
  var key=room.status+'_'+room.phase+'_'+room.night_phase;
  var phaseText='',phaseClass='',name='';

  if(room.status==='waiting'){name='⏳ در انتظار بازیکنان';phaseClass='phase-day';}
  else if(room.status==='playing'){
    if(room.phase==='day'){name='☀️ روز '+room.day_count+' - بحث آزاد';phaseClass='phase-day';}
    else if(room.phase==='voting'){name='🗳️ رأی‌گیری روز '+room.day_count;phaseClass='phase-voting';}
    else if(room.phase==='night'){
      var map={mafia:'مافیا بیدارن',doctor:'دکتر بیدار شه',sniper:'تیرانداز بیدار شه',helper:'یاور بیدار شه',gunner:'تفنگدار بیدار شه',resolution:'نتیجه شب'};
      name='🌙 شب '+room.day_count+' - '+(map[room.night_phase]||'');
      phaseClass='phase-night';
    }
    else if(room.phase==='resolution'){name='☀️ نتیجه شب';phaseClass='phase-day';}
    else if(room.phase==='ended'){name='🏁 بازی تموم شد';phaseClass='phase-res';}
  }
  bar.className='phase-bar '+phaseClass;
  bar.setAttribute('data-name',name);
  bar.textContent=name;

  if(key!==lastPhaseKey){
    lastPhaseKey=key;
    if(room.status==='playing'&&room.phase==='night'){playPhaseAudio(room.night_phase);if(room.night_phase!=='resolution')startBgMusic();}
    else if(room.phase==='resolution'){stopBgMusic();playPhaseAudio('resolution');}
    else stopBgMusic();
    handlePhaseAction(room);
  }
}

// ===== Players =====
function loadPlayers(room){
  supabaseClient.from('mafia_players').select('*').eq('room_id',myRoomId).then(r=>{
    var ps=r.data||[];
    var list=document.getElementById('playersList');
    list.innerHTML='';
    ps.forEach(p=>{
      var sp=document.createElement('span');
      sp.className='m-player'+(p.is_alive?'':' dead')+(p.user_id===myUid?' self':'')+(p.is_deputy?' deputy':'');
      var icon='';
      if(p.is_silenced)icon+=' 🔇';
      if(p.is_deputy)icon+=' ⭐';
      sp.textContent=p.username+(p.user_id===myUid?' (تو)':'')+icon;
      list.appendChild(sp);
    });
    document.getElementById('playerCount').textContent=ps.length;
    if(room.status==='waiting'&&ps.length>=MIN_PLAYERS&&room.host_id===myUid){
      if(!document.getElementById('startBtn')){
        var b=document.createElement('button');
        b.id='startBtn';b.className='mafia-btn';b.textContent='🎬 شروع بازی';
        b.onclick=startGame;
        document.getElementById('playersList').parentElement.appendChild(b);
      }
    }
  });
}

// ===== Role =====
function loadRole(room){
  if(!myPlayerId)return;
  supabaseClient.from('mafia_players').select('*').eq('id',myPlayerId).single().then(r=>{
    if(!r.data||!r.data.role)return;
    myGameRole=r.data.role;
    document.getElementById('roleCardWrap').style.display='block';
    document.getElementById('roleName').textContent=(ROLE_NAMES[myGameRole]||myGameRole);
    document.getElementById('roleDesc').textContent=(ROLE_DESCS[myGameRole]||'');
  });
}

// ===== Chats =====
function loadChats(room){
  var isMafia=['godfather','natasha','mafia'].includes(myGameRole);
  var isHelperTeam=myGameRole==='helper'||(myPlayer&&myPlayer.is_deputy);
  var isDay=room.phase==='day'||room.phase==='voting';
  var isNight=room.phase==='night';

  document.getElementById('mafiaChatCard').style.display=(isMafia&&isNight)?'block':'none';
  document.getElementById('helperChatCard').style.display=(isHelperTeam&&isNight)?'block':'none';
  document.getElementById('publicChatCard').style.display=isDay?'block':'none';

  supabaseClient.from('mafia_messages').select('*').eq('room_id',myRoomId).then(r=>{
    var msgs=r.data||[];
    var pub=msgs.filter(m=>m.chat_type==='public');
    var maf=msgs.filter(m=>m.chat_type==='mafia');
    var hlp=msgs.filter(m=>m.chat_type==='helper');
    renderChat('publicChat',pub);
    if(isMafia)renderChat('mafiaChat',maf);
    if(isHelperTeam)renderChat('helperChat',hlp);
  });
}

function renderChat(id,msgs){
  var box=document.getElementById(id);if(!box)return;
  box.innerHTML='';
  msgs.forEach(m=>{
    var d=document.createElement('div');
    d.className='m-msg';
    var style=(m.user_id===myUid&&myChatColor)?'style="background:'+myChatColor+';color:#fff;padding:4px 8px;border-radius:6px;"':'';
    var st=renderStickerInChat(m.message);
    d.innerHTML='<strong>'+m.username+':</strong> <span '+style+'>'+(st||m.message)+'</span>';
    box.appendChild(d);
  });
  box.scrollTop=box.scrollHeight;
}

window.sendChat=function(type){
  var inputId=type==='mafia'?'mafiaChatInput':type==='helper'?'helperChatInput':'publicChatInput';
  var input=document.getElementById(inputId);
  var text=input.value.trim();
  if(!text||!myRoomId)return;
  
  if(type==='public'){
    var blocked=BLOCKED.some(w=>text.includes(w));
    if(blocked){alert('⚠️ صحبت درباره نقش‌ها یا لو دادن اطلاعات ممنوعه!');return;}
  }
  input.value='';
  supabaseClient.from('mafia_messages').insert({room_id:myRoomId,user_id:myUid,username:myName,message:text,chat_type:type});
};

// ===== Yes/No Modal =====
function askYesNo(question,onYes,onNo){
  document.getElementById('ynQuestion').textContent=question;
  ynCallbackYes=onYes;ynCallbackNo=onNo;
  document.getElementById('yesNoModal').classList.remove('hidden');
}
window.ynYes=function(){document.getElementById('yesNoModal').classList.add('hidden');if(ynCallbackYes)ynCallbackYes();};
window.ynNo=function(){document.getElementById('yesNoModal').classList.add('hidden');if(ynCallbackNo)ynCallbackNo();};

// ===== Target Modal =====
var tgtCallback=null;
function askTarget(title,players,onSelect){
  document.getElementById('tgtTitle').textContent=title;
  var list=document.getElementById('tgtList');list.innerHTML='';
  players.forEach(p=>{
    var b=document.createElement('button');
    b.className='target-btn';b.textContent=p.username;
    b.onclick=()=>{document.getElementById('targetModal').classList.add('hidden');onSelect(p);};
    list.appendChild(b);
  });
  document.getElementById('targetModal').classList.remove('hidden');
}
window.closeTarget=()=>document.getElementById('targetModal').classList.add('hidden');

// ===== Handle phase-specific UI =====
function handlePhaseAction(room){
  if(room.status!=='playing')return;
  var ph=room.phase;
  if(ph==='night')handleNightPhase(room.night_phase);
}

function handleNightPhase(nightPhase){
  var me=myGameRole;
  // Auto: shoot buttons for citizens with bullets
  if(nightPhase==='doctor'&&me==='doctor')doDoctorAction();
  else if(nightPhase==='sniper'&&me==='sniper')doSniperAction();
  else if(nightPhase==='helper'&&me==='helper')doHelperAction();
  else if(nightPhase==='gunner'&&me==='gunner')doGunnerAction();
}

// ===== Doctor =====
function doDoctorAction(){
  supabaseClient.from('mafia_players').select('*').eq('room_id',myRoomId).eq('is_alive',true).then(r=>{
    var alive=r.data||[];
    askYesNo('💊 آیا می‌خوای یک نفر رو نجات بدی؟',()=>{
      askTarget('کی رو نجات بدی؟',alive.filter(p=>p.user_id!==myUid||true),p=>{
        supabaseClient.from('mafia_actions').insert({room_id:myRoomId,actor_id:myUid,target_id:p.id,action:'save',day_count:1});
      });
    },()=>{});
  });
}

// ===== Sniper =====
function doSniperAction(){
  supabaseClient.from('mafia_players').select('*').eq('room_id',myRoomId).eq('user_id',myUid).single().then(r=>{
    var shots=(r.data.shots_used||0);
    if(shots>=3){return;}
    var left=3-shots;
    supabaseClient.from('mafia_players').select('*').eq('room_id',myRoomId).eq('is_alive',true).then(rs=>{
      var alive=(rs.data||[]).filter(p=>p.user_id!==myUid);
      askYesNo('🎯 تیر باقی‌مونده: '+left+'/۳ | شلیک می‌کنی؟',()=>{
        askTarget('شلیک به کی؟',alive,p=>{
          supabaseClient.from('mafia_players').update({shots_used:shots+1}).eq('id',myPlayerId);
          supabaseClient.from('mafia_actions').insert({room_id:myRoomId,actor_id:myUid,target_id:p.id,action:'sniper_shot',day_count:1});
        });
      },()=>{});
    });
  });
}

// ===== Helper =====
function doHelperAction(){
  supabaseClient.from('mafia_players').select('*').eq('room_id',myRoomId).eq('is_alive',true).then(r=>{
    var alive=r.data||[];
    var notDeputies=alive.filter(p=>!p.is_deputy&&p.user_id!==myUid);
    askYesNo('🤝 آیا می‌خوای یک یار جدید اضافه کنی؟',()=>{
      if(notDeputies.length===0)return alert('همه یار شدن!');
      askTarget('کی رو به یارها اضافه کنی؟',notDeputies,p=>{
        supabaseClient.from('mafia_players').update({is_deputy:true}).eq('id',p.id);
        supabaseClient.from('mafia_actions').insert({room_id:myRoomId,actor_id:myUid,target_id:p.id,action:'add_deputy',day_count:1});
      });
    },()=>{});
  });
}

// ===== Gunner =====
function doGunnerAction(){
  supabaseClient.from('mafia_players').select('*').eq('room_id',myRoomId).eq('user_id',myUid).single().then(r=>{
    var shots=(r.data.shots_used||0);
    if(shots>=3){return;}
    var left=3-shots;
    supabaseClient.from('mafia_players').select('*').eq('room_id',myRoomId).eq('is_alive',true).then(rs=>{
      var alive=(rs.data||[]).filter(p=>p.user_id!==myUid);
      askYesNo('🔫 تیر باقی‌مونده: '+left+'/۳ | به کسی تیر میدی؟',()=>{
        askTarget('به کی تیر بدی؟',alive,p=>{
          supabaseClient.from('mafia_players').update({shots_used:shots+1}).eq('id',myPlayerId);
          supabaseClient.from('mafia_players').select('bullets').eq('id',p.id).single().then(pb=>{
            supabaseClient.from('mafia_players').update({bullets:(pb.data.bullets||0)+1}).eq('id',p.id);
          });
          supabaseClient.from('mafia_actions').insert({room_id:myRoomId,actor_id:myUid,target_id:p.id,action:'give_gun',day_count:1});
        });
      },()=>{});

// ===== Game start =====
function startGame(){
  supabaseClient.from('mafia_players').select('*').eq('room_id',myRoomId).then(r=>{
    var ps=r.data||[];
    if(ps.length<MIN_PLAYERS)return alert('حداقل ۱۲ نفر!');
    var roles=['godfather','natasha','mafia','mafia','citizen','citizen','doctor','detective','mayor','sniper','gunner','helper'];
    roles.sort(()=>Math.random()-.5);
    Promise.all(ps.map((p,i)=>supabaseClient.from('mafia_players').update({role:roles[i],bullets:0,shots_used:0,is_deputy:false,has_veto:true}).eq('id',p.id))).then(()=>{
      supabaseClient.from('mafia_rooms').update({status:'playing',phase:'day',day_count:1,night_phase:'mafia'}).eq('id',myRoomId);
    });
  });
}

// ===== Host advance =====
window.hostAdvance=function(){
  if(!isHost)return;
  supabaseClient.from('mafia_rooms').select('*').eq('id',myRoomId).single().then(r=>{
    var room=r.data;if(!room)return;
    if(room.status==='waiting'){
      // start handled by button
      return;
    }
    if(room.phase==='day'){
      supabaseClient.from('mafia_rooms').update({phase:'voting',phase_end_time:new Date(Date.now()+30*1000).toISOString()}).eq('id',myRoomId);
      return;
    }
    if(room.phase==='voting'){
      // Resolve vote
      resolveVote(room);
      return;
    }
    if(room.phase==='night'){
      advanceNight(room);
      return;
    }
    if(room.phase==='resolution'){
      supabaseClient.from('mafia_rooms').update({phase:'day',phase_end_time:null}).eq('id',myRoomId);
    }
  });
};

function advanceNight(room){
  var order=['mafia','doctor','sniper','helper','gunner','resolution'];
  var idx=order.indexOf(room.night_phase);
  if(idx<0)idx=0;
  if(room.night_phase==='gunner'){
    // Resolve night
    resolveNight(room);
    return;
  }
  var next=order[idx+1];
  var dur=DURATIONS[next]||30;
  supabaseClient.from('mafia_rooms').update({night_phase:next,phase_end_time:new Date(Date.now()+dur*1000).toISOString()}).eq('id',myRoomId);
}

function resolveVote(room){
  supabaseClient.from('mafia_players').select('*').eq('room_id',myRoomId).then(r=>{
    var ps=r.data||[];
    var votes={};
    ps.forEach(p=>{if(p.voted_for)votes[p.voted_for]=(votes[p.voted_for]||0)+1;});
    var maxId=null,maxV=0;
    for(var k in votes){if(votes[k]>maxV){maxV=votes[k];maxId=k;}}
    if(maxId){
      // Check if mayor wants to veto (simple: skip for now, just execute)
      supabaseClient.from('mafia_players').update({is_alive:false}).eq('id',maxId);
    }
    supabaseClient.from('mafia_players').update({voted_for:null}).eq('room_id',myRoomId);
    supabaseClient.from('mafia_rooms').update({phase:'night',night_phase:'mafia',phase_end_time:new Date(Date.now()+60*1000).toISOString()}).eq('id',myRoomId);
    checkWin(room.day_count+1);
  });
}

function resolveNight(room){
  var killTarget=null,saveTarget=null,sniperTarget=null;
  var sniperActor=null;
  supabaseClient.from('mafia_actions').select('*').eq('room_id',myRoomId).eq('day_count',room.day_count).then(r=>{
    var acts=r.data||[];
    acts.forEach(a=>{
      if(a.action==='kill')killTarget=a.target_id;
      if(a.action==='save')saveTarget=a.target_id;
      if(a.action==='sniper_shot'){sniperTarget=a.target_id;sniperActor=a.actor_id;}
    });
    var updates=[];
    // Mafia kill
    if(killTarget&&killTarget!==saveTarget)updates.push(supabaseClient.from('mafia_players').update({is_alive:false}).eq('id',killTarget));
    // Sniper shot
    if(sniperTarget){
      supabaseClient.from('mafia_players').select('role').eq('id',sniperTarget).single().then(tg=>{
        var isMafia=['godfather','natasha','mafia'].includes(tg.data.role);
        if(isMafia)supabaseClient.from('mafia_players').update({is_alive:false}).eq('id',sniperTarget);
        else supabaseClient.from('mafia_players').update({is_alive:false}).eq('id',sniperActor);
      });
    }
    Promise.all(updates).then(()=>{
      supabaseClient.from('mafia_rooms').update({phase:'resolution',phase_end_time:new Date(Date.now()+5*1000).toISOString()}).eq('id',myRoomId);
    });
  });
}

function checkWin(nextDay){
  supabaseClient.from('mafia_players').select('*').eq('room_id',myRoomId).then(r=>{
    var alive=(r.data||[]).filter(p=>p.is_alive);
    var mafias=alive.filter(p=>['godfather','natasha','mafia'].includes(p.role)).length;
    var citizens=alive.length-mafias;
    if(mafias===0){
      supabaseClient.from('mafia_rooms').update({phase:'ended',status:'ended'}).eq('id',myRoomId);
      alert('🎉 شهروندها بردن!');
    } else if(mafias>=citizens){
      supabaseClient.from('mafia_rooms').update({phase:'ended',status:'ended'}).eq('id',myRoomId);
      alert('🐺 مافیا بردن!');
    }
  });
}
