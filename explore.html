<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اکسپلور | ساراگل</title>
  <link rel="stylesheet" href="style.css">
  <style>
    #exploreFeed { display: flex; flex-direction: column; gap: 24px; padding-bottom: 20px; }
    .post-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    .post-media-wrapper { width: 100%; background: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 200px; max-height: 500px; overflow: hidden; }
    .post-media-wrapper video, .post-media-wrapper img { width: 100%; max-height: 500px; object-fit: contain; display: block; }
    .post-footer { padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; background: var(--bg-card); border-top: 1px solid var(--border); }
    .like-btn { background: var(--bg); border: 1px solid var(--border); border-radius: 20px; padding: 8px 16px; font-size: 1rem; cursor: pointer; display: flex; align-items: center; gap: 8px; font-family: inherit; color: var(--text); transition: all 0.2s; }
    .like-btn:hover { background: var(--border); }
    .like-btn .heart { transition: transform 0.2s; font-size: 1.1rem; }
    .like-btn .heart.liked { transform: scale(1.2); }
    
    /* دکمه شناور آپلود (فقط ادمین) */
    .admin-fab { position: fixed; bottom: 90px; left: 20px; width: 60px; height: 60px; background: var(--green); color: #fff; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 2rem; box-shadow: 0 4px 15px rgba(0,0,0,0.3); cursor: pointer; z-index: 100; border: none; }
    .admin-fab:hover { transform: scale(1.1); }
  </style>
</head>
<body>

<header class="header">
  <div class="logo">ساراگل</div>
  <div class="user-area">
    <span class="user-name">—</span>
    <div class="avatar">—</div>
  </div>
</header>

<main class="container">
  <h2 style="margin-bottom: 20px;">🎬 اکسپلور</h2>
  
  <section id="exploreFeed">
    <p class="lock-note">در حال بارگذاری...</p>
  </section>
</main>

<!-- دکمه شناور برای ادمین -->
<button class="admin-fab hidden" id="uploadFab" onclick="document.getElementById('uploadFile').click()">+</button>
<input type="file" id="uploadFile" accept="video/*,image/*" style="display: none;" onchange="uploadToExplore(this)">

<!-- مودال نمایش لایک‌ها -->
<div id="likesModal" class="modal hidden">
  <div class="modal-box" style="max-width: 350px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <h3 style="font-size: 1rem; margin: 0;">❤️ لایک‌کنندگان</h3>
      <button onclick="document.getElementById('likesModal').classList.add('hidden')" style="background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text);">&times;</button>
    </div>
    <div id="likesList" style="max-height: 250px; overflow-y: auto; text-align: right;">
      <p style="text-align: center; color: var(--text-dim);">در حال بارگذاری...</p>
    </div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="index.html" class="nav-item">🏠 خانه</a>
  <a href="study.html" class="nav-item">⏱ مطالعه</a>
  <a href="explore.html" class="nav-item active">🎬 اکسپلور</a>
  <a href="shop.html" class="nav-item">🛒 فروشگاه</a>
  <a href="profile.html" class="nav-item">👤 پروفایل</a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="auth.js"></script>
<script src="theme.js"></script>
<script src="explore.js"></script>
</body>
</html>
