<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اکسپلور | ساراگل</title>
  <link rel="stylesheet" href="style.css">
  <style>
    #exploreFeed { display: flex; flex-direction: column; gap: 24px; padding-bottom: 20px; }
    .post-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    .post-media-wrapper { width: 100%; background: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 200px; }
    .post-media-wrapper video, .post-media-wrapper img { width: 100%; max-height: 500px; object-fit: contain; display: block; }
    .post-footer { padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; background: var(--bg-card); border-top: 1px solid var(--border); }
    .like-btn { background: var(--bg); border: 1px solid var(--border); border-radius: 20px; padding: 8px 16px; font-size: 1rem; cursor: pointer; display: flex; align-items: center; gap: 8px; font-family: inherit; color: var(--text); transition: all 0.2s; }
    .like-btn:hover { background: var(--border); }
    .like-btn .heart { transition: transform 0.2s; font-size: 1.1rem; }
    .like-btn .heart.liked { transform: scale(1.2); }
    
    /* تاریخچه ادمین */
    .admin-history-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-top: 30px; margin-bottom: 20px; }
    .history-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px dashed var(--border); font-size: 0.85rem; gap: 10px; }
    .history-row:last-child { border-bottom: none; }
  </style>
</head>
<body>

<header class="header">
  <div class="logo">ساراگل</div>
  <div class="user-area">
    <span class="user-name">—</span>
    <div class="avatar">—</div>
  </div>
</header>

<main class="container">
  <h2 style="margin-bottom: 20px;">🎬 اکسپلور</h2>
  
  <section id="exploreFeed"><p class="lock-note">در حال بارگذاری...</p></section>

  <section id="adminLikesSection" style="display: none;" class="admin-history-card">
    <h3 style="margin-bottom: 12px; font-size: 1.1rem; color: var(--green);">❤️ تاریخچه لایک‌ها (ویژه ادمین)</h3>
    <div id="adminLikesList"><p class="lock-note">در حال بارگذاری...</p></div>
  </section>
</main>

  <a href="index.html" class="nav-item">🏠 خانه</a>
  <a href="study.html" class="nav-item">⏱ مطالعه</a>
  <a href="explore.html" class="nav-item active">🎬 اکسپلور</a>
  <a href="shop.html" class="nav-item">🛒 فروشگاه</a>
  <a href="profile.html" class="nav-item">👤 پروفایل</a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="auth.js"></script>
<script src="theme.js"></script>
<script src="explore.js"></script>
</body>
</html>
