<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اکسپلور | ساراگل</title>
  <link rel="stylesheet" href="style.css">
  <style>
    #exploreFeed { display: flex; flex-direction: column; gap: 24px; padding-bottom: 80px; }
    .post-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    .post-media-wrapper { width: 100%; background: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 200px; max-height: 500px; overflow: hidden; }
    .post-media-wrapper video, .post-media-wrapper img { width: 100%; max-height: 500px; object-fit: contain; display: block; }
    .post-footer { padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; background: var(--bg-card); border-top: 1px solid var(--border); }
    
    .like-btn, .view-likes-btn { background: var(--bg); border: 1px solid var(--border); border-radius: 20px; padding: 6px 12px; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; gap: 6px; font-family: inherit; color: var(--text); transition: 0.2s; }
    .like-btn:hover, .view-likes-btn:hover { background: var(--border); }
    .heart { font-size: 1.1rem; transition: 0.2s; }
    .heart.liked { transform: scale(1.2); }
    
    /* دکمه شناور آپلود */
    .admin-fab { position: fixed; bottom: 90px; left: 20px; width: 60px; height: 60px; background: var(--green); color: #fff; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 2rem; box-shadow: 0 4px 15px rgba(0,0,0,0.3); cursor: pointer; z-index: 100; border: none; }
    .admin-fab:hover { transform: scale(1.1); }
    
    /* مودال‌ها */
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
    .modal.hidden { display: none; }
    .modal-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; width: 100%; max-width: 400px; text-align: center; max-height: 80vh; overflow-y: auto; }
    .user-like-row { display: flex; align-items: center; gap: 10px; padding: 10px; border-bottom: 1px solid var(--border); }
    .user-like-avatar { width: 35px; height: 35px; border-radius: 50%; background: var(--blue); color: #fff; display: flex; justify-content: center; align-items: center; font-weight: bold; }
  </style>
</head>
<body>

<header class="header">
  <div class="logo">ساراگل</div>
  <div class="user-area">
    <span class="user-name">—</span>
    <div class="avatar">—</div>
  </div>
</header>

<main class="container">
  <h2 style="margin-bottom: 20px;">🎬 اکسپلور</h2>
  
  <section id="exploreFeed">
    <p class="lock-note">در حال بارگذاری...</p>
  </section>

  <!-- دکمه شناور آپلود (فقط ادمین) -->
  <button id="uploadFab" class="admin-fab hidden" onclick="openUploadModal()">+</button>

  <!-- مودال آپلود -->
  <div id="uploadModal" class="modal hidden">
    <div class="modal-box">
      <h3 style="margin-bottom: 12px;">آپلود پست جدید</h3>
      <input type="file" id="uploadFile" accept="image/*,video/*" class="input" style="margin-bottom: 12px; padding: 8px;">
      <button onclick="uploadPost()" class="btn btn-green btn-full" id="uploadBtn">آپلود و انتشار</button>
      <button onclick="document.getElementById('uploadModal').classList.add('hidden')" class="btn btn-dim btn-full" style="margin-top: 8px;">انصراف</button>
      <p id="uploadMsg" style="font-size: 0.8rem; margin-top: 8px;"></p>
    </div>
  </div>

  <!-- مودال لایک‌کنندگان -->
  <div id="likesModal" class="modal hidden">
    <div class="modal-box">
      <h3 style="margin-bottom: 12px;">لیست لایک‌کنندگان</h3>
      <div id="likesList"></div>
      <button onclick="document.getElementById('likesModal').classList.add('hidden')" class="btn btn-dim btn-full" style="margin-top: 12px;">بستن</button>
    </div>
  </div>
</main>

<nav class="bottom-nav">
  <a href="index.html" class="nav-item">🏠 خانه</a>
  <a href="study.html" class="nav-item">⏱ مطالعه</a>
  <a href="explore.html" class="nav-item active">🎬 اکسپلور</a>
  <a href="shop.html" class="nav-item">🛒 فروشگاه</a>
  <a href="profile.html" class="nav-item">👤 پروفایل</a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="auth.js"></script>
<script src="theme.js"></script>
<script src="explore.js"></script>
</body>
</html>
