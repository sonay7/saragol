<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل ادمین | ساراگل</title>
  <link rel="stylesheet" href="style.css">
  <style>
    details.accordion { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 12px; overflow: hidden; }
    details.accordion[open] { border-color: var(--green); }
    summary.accordion-header { padding: 16px; font-weight: bold; font-size: 1rem; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; color: var(--text); }
    summary.accordion-header::after { content: '▼'; font-size: 0.7rem; color: var(--text-dim); }
    details[open] summary.accordion-header::after { transform: rotate(180deg); color: var(--green); }
    .accordion-content { padding: 0 16px 16px 16px; border-top: 1px solid var(--border); }
    .admin-row { display: flex; justify-content: space-between; align-items: center; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; gap: 8px; flex-wrap: wrap; font-size: 0.85rem; }
    .admin-sub { font-size: 0.75rem; color: var(--text-dim); display: block; margin-top: 4px; }
  </style>
</head>
<body>

<header class="header">
  <div class="logo">پنل ادمین</div>
  <div class="user-area">
    <span class="user-name">—</span>
    <div class="avatar">—</div>
  </div>
</header>

<main class="container">

  <!-- 1. اعلانات -->
  <details class="accordion">
    <summary class="accordion-header">📌 اعلانات</summary>
    <div class="accordion-content">
      <div style="background: var(--bg); padding: 12px; border-radius: 10px; margin: 10px 0;">
        <textarea id="noticeText" class="input" placeholder="متن اعلان..." style="min-height: 60px;"></textarea>
        <select id="noticeType" class="input" style="margin-top: 8px;">
          <option value="urgent">فوری</option>
          <option value="important">مهم</option>
          <option value="info">عادی</option>
        </select>
        <button id="addNoticeBtn" class="btn btn-green btn-full" style="margin-top: 8px;">ثبت</button>
      </div>
      <div id="adminNoticesList"></div>
    </div>
  </details>

  <!-- 2. سینما -->
  <details class="accordion">
    <summary class="accordion-header">🎬 سینما (فیلم‌ها)</summary>
    <div class="accordion-content">
      <div style="margin: 10px 0;">
        <input id="cinemaTitle" class="input" placeholder="اسم فیلم" style="margin-bottom: 8px;">
        <input id="cinemaDesc" class="input" placeholder="توضیحات" style="margin-bottom: 8px;">
        <input id="cinemaUrl" class="input" placeholder="لینک Embed آپارات" style="margin-bottom: 8px;">
        <input id="cinemaPrice" type="number" class="input" placeholder="قیمت (XP)" style="margin-bottom: 8px;">
        <button onclick="addCinemaVideo()" class="btn btn-green btn-full">➕ افزودن</button>
      </div>
      <div id="adminCinemaList"></div>
    </div>
  </details>

  <!-- 3. جمله‌ها -->
  <details class="accordion">
    <summary class="accordion-header">💬 جمله‌ها</summary>
    <div class="accordion-content">
      <div style="margin: 10px 0;">
        <input id="quoteText" class="input" placeholder="متن جمله..." style="margin-bottom: 8px;">
        <button onclick="addQuote()" class="btn btn-green btn-full">➕ افزودن جمله</button>
      </div>
      <div id="adminQuotesList"></div>
    </div>
  </details>

  <!-- 4. اپلود ویدیو (اکسپلور) -->
  <details class="accordion">
    <summary class="accordion-header">🎥 آپلود ویدیو (اکسپلور)</summary>
    <div class="accordion-content">
      <div style="margin: 10px 0;">
        <input id="exploreTitle" class="input" placeholder="عنوان ویدیو" style="margin-bottom: 8px;">
        <input id="exploreDesc" class="input" placeholder="توضیحات" style="margin-bottom: 8px;">
        <input id="exploreUrl" class="input" placeholder="لینک ویدیو (آپارات/یوتیوب)" style="margin-bottom: 8px;">
        <button onclick="addExploreVideo()" class="btn btn-green btn-full">➕ افزودن</button>
      </div>
      <div id="adminExploreList"></div>
    </div>
  </details>

  <!-- 5. ماموریت‌ها -->
  <details class="accordion">
    <summary class="accordion-header">🎯 ماموریت‌ها</summary>
    <div class="accordion-content">
      <div style="margin: 10px 0;">
        <input id="questTitle" class="input" placeholder="عنوان" style="margin-bottom: 8px;">
        <select id="questType" class="input" style="margin-bottom: 8px;">
          <option value="study">مطالعه (دقیقه)</option>
          <option value="questions">تست (تعداد)</option>
          <option value="streak">استریک</option>
        </select>
        <input id="questTarget" type="number" class="input" placeholder="هدف" style="margin-bottom: 8px;">
        <input id="questXp" type="number" class="input" placeholder="جایزه XP" style="margin-bottom: 8px;">
        <button onclick="addQuest()" class="btn btn-green btn-full">➕ افزودن</button>
      </div>
      <div id="adminQuestsList"></div>
    </div>
  </details>

  <!-- 6. آزمون‌ها -->
  <details class="accordion">
    <summary class="accordion-header">📝 آزمون‌ها</summary>
    <div class="accordion-content">
      <div id="examsList"></div>
      <div style="margin: 10px 0;">
        <input id="examSubject" class="input" placeholder="درس" style="margin-bottom: 8px;">
        <input id="examDate" type="date" class="input" style="margin-bottom: 8px;">
        <button id="addExamBtn" class="btn btn-green btn-full">افزودن آزمون</button>
      </div>
    </div>
  </details>

  <!-- 7. کاربران -->
  <details class="accordion">
    <summary class="accordion-header">👥 کاربران</summary>
    <div class="accordion-content">
      <h4 style="font-size: 0.9rem; margin: 10px 0 8px;">درخواست‌های عضویت:</h4>
      <div id="requestsList"></div>
      <h4 style="font-size: 0.9rem; margin: 16px 0 8px;">کاربران تایید شده:</h4>
      <div id="usersList"></div>
    </div>
  </details>

  <!-- 8. اهدای نشان -->
  <details class="accordion">
    <summary class="accordion-header">🌟 اهدای نشان</summary>
    <div class="accordion-content">
      <div style="margin: 10px 0;">
        <input id="badgeUsername" class="input" placeholder="نام کاربری" style="margin-bottom: 8px;">
        <select id="badgeName" class="input" style="margin-bottom: 8px;">
          <option value="اولین ستاره">🌟 اولین ستاره</option>
          <option value="پیشتاز مطالعه">🚀 پیشتاز</option>
        </select>
        <button onclick="giveBadge()" class="btn btn-green btn-full">اهدا</button>
      </div>
      <div id="adminBadgesList"></div>
    </div>
  </details>

  <!-- 9. صندوق ورودی -->
  <details class="accordion">
    <summary class="accordion-header">📥 صندوق ورودی</summary>
    <div class="accordion-content">
      <div id="inboxList" style="margin-top: 10px;"></div>
    </div>
  </details>
<details class="accordion">
  <summary class="accordion-header">📝 فلش‌کارت‌های عمومی (نکات)</summary>
  <div class="accordion-content">
    <div style="margin: 10px 0; background: var(--bg); padding: 12px; border-radius: 10px;">
      <select id="fcGrade" class="input" style="margin-bottom: 8px;">
        <option value="هفتم">هفتم</option>
        <option value="هشتم">هشتم</option>
        <option value="نهم">نهم</option>
      </select>
      <input id="fcSubject" class="input" placeholder="درس (مثلاً ریاضی)" style="margin-bottom: 8px;">
      <input id="fcQuestion" class="input" placeholder="سوال (مثلاً فرمول مساحت دایره)" style="margin-bottom: 8px;">
      <input id="fcAnswer" class="input" placeholder="جواب (مثلاً πr²)" style="margin-bottom: 8px;">
      <button onclick="addPublicFlashcard()" class="btn btn-green btn-full">➕ افزودن</button>
    </div>
    <div id="adminFlashcardsList"></div>
  </div>
</details>
</main>

<nav class="bottom-nav">
  <a href="index.html" class="nav-item">🏠 خانه</a>
  <a href="study.html" class="nav-item">⏱ مطالعه</a>
  <a href="shop.html" class="nav-item">🛒 فروشگاه</a>
  <a href="admin.html" class="nav-item active">🛠 ادمین</a>
  <a href="profile.html" class="nav-item">👤 پروفایل</a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="auth.js"></script>
<script src="theme.js"></script>
<script src="admin.js"></script>
</body>
</html>
