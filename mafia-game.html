<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بازی مافیا | ساراگل</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .game-header-box { text-align: center; padding: 16px; background: var(--bg-card); border-radius: 16px; margin-bottom: 16px; }
    .phase-indicator { font-size: 1.2rem; font-weight: bold; margin-bottom: 8px; }
    .phase-night { color: #5d6d9e; }
    .phase-day { color: #f39c12; }
    .phase-voting { color: #e74c3c; }
    .phase-lobby { color: var(--green); }
    .day-counter { font-size: 0.85rem; color: var(--text-dim); }
    
    .role-card { background: linear-gradient(135deg, var(--bg-card), var(--bg)); border: 2px solid var(--gold, #f1c40f); border-radius: 16px; padding: 16px; text-align: center; margin-bottom: 16px; }
    .role-card h3 { color: var(--gold, #f1c40f); margin-bottom: 8px; }
    .role-card p { font-size: 0.85rem; color: var(--text-dim); }
    
    .players-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin-bottom: 16px; }
    .player-item { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 10px; font-size: 0.85rem; display: flex; justify-content: space-between; align-items: center; }
    .player-item.dead { opacity: 0.4; text-decoration: line-through; }
    .player-item.me { border-color: var(--green); }
    
    .action-box { background: var(--bg-card); border: 1px solid var(--blue); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .action-box h3 { color: var(--blue); margin-bottom: 12px; font-size: 0.95rem; }
    .action-btn { padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); cursor: pointer; font-family: inherit; margin: 4px; font-size: 0.8rem; }
    .action-btn:hover { border-color: var(--blue); }
    .action-btn.selected { background: var(--blue); color: #fff; border-color: var(--blue); }
    
    .chat-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; height: 350px; display: flex; flex-direction: column; margin-bottom: 16px; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .chat-msg { max-width: 85%; padding: 8px 12px; border-radius: 10px; font-size: 0.85rem; }
    .chat-msg.me { align-self: flex-end; background: var(--green); color: #fff; }
    .chat-msg.other { align-self: flex-start; background: var(--bg); border: 1px solid var(--border); }
    .chat-msg .msg-name { font-size: 0.7rem; color: var(--blue); font-weight: bold; margin-bottom: 2px; }
    .chat-msg.mafia { border: 1px solid #c0392b; }
    .chat-msg.mafia .msg-name { color: #e74c3c; }
    .chat-input { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--border); }
    .chat-input input { flex: 1; padding: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 8px; font-family: inherit; }
    .chat-input button { padding: 10px 16px; background: var(--green); color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-family: inherit; }
    
    .winner-box { text-align: center; padding: 40px 20px; background: var(--bg-card); border: 2px solid var(--gold, #f1c40f); border-radius: 16px; margin-bottom: 16px; }
    .winner-box h2 { font-size: 1.5rem; color: var(--gold, #f1c40f); margin-bottom: 16px; }
    
    .host-controls { background: #2c1e16; border: 1px solid #f1c40f; border-radius: 12px; padding: 16px; margin-bottom: 16px; text-align: center; }
    .host-controls h3 { color: #f1c40f; margin-bottom: 12px; font-size: 0.95rem; }
    .host-controls button { padding: 12px 24px; background: #f1c40f; color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-family: inherit; }
    
    .system-msg { text-align: center; color: var(--text-dim); font-size: 0.8rem; padding: 8px; font-style: italic; }
  </style>
</head>
<body>

  <header class="header">
    <div class="logo">ساراگل</div>
    <div class="user-area">
      <span class="user-name">—</span>
      <div class="avatar">—</div>
    </div>
  </header>

  <main class="container" style="padding-top: 10px;">
    <div id="gameContent">
      <p class="lock-note">در حال بارگذاری...</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="auth.js"></script>
  <script src="theme.js"></script>
  <script>
    var gameId = new URLSearchParams(window.location.search).get('id');
    var currentUser = null;
    var myRole = null;
    var gameState = null;
    var myPlayerInfo = null;
    var selectedTarget = null;
    var selectedVote = null;
    var bannedWords = [];

    if (!gameId) { window.location.href = 'mafia.html'; }

    supabaseClient.auth.getUser().then(function(res) {
      if (!res.data.user) { window.location.href = 'login.html'; return; }
      currentUser = res.data.user;
      
      // گرفتن کلمات ممنوعه
      supabaseClient.from('banned_words').select('word').then(function(bw) {
        bannedWords = (bw.data || []).map(function(w) { return w.word; });
      });

      loadGame();
      setInterval(loadGame, 2000);
    });

    function loadGame() {
      supabaseClient.from('mafia_games').select('*').eq('id', gameId).single().then(function(gRes) {
        if (gRes.error || !gRes.data) { window.location.href = 'mafia.html'; return; }
        gameState = gRes.data;

        supabaseClient.from('mafia_players').select('*, profiles(username)').eq('game_id', gameId).then(function(pRes) {
          var players = pRes.data || [];
          myPlayerInfo = players.find(function(p) { return p.user_id === currentUser.id; });
          
          if (!myPlayerInfo) { window.location.href = 'mafia.html'; return; }
          myRole = myPlayerInfo.role;

          renderGame(players);
        });
      });
    }

    function renderGame(players) {
      var content = document.getElementById('gameContent');
      var phase = gameState.phase;
      var status = gameState.status;

      if (status === 'finished') {
        renderFinished(content, players);
        return;
      }

      var html = '';

      // هدر فاز
      html += '<div class="game-header-box">';
      if (phase === 'lobby') {
        html += '<div class="phase-indicator phase-lobby">🎭 لابی</div>';
        html += '<div class="day-counter">منتظر شروع بازی...</div>';
      } else if (phase === 'night') {
        html += '<div class="phase-indicator phase-night">🌙 شب ' + gameState.day_number + '</div>';
        html += '<div class="day-counter">شهر به خواب رفته...</div>';
      } else if (phase === 'day') {
        html += '<div class="phase-indicator phase-day">☀️ روز ' + gameState.day_number + '</div>';
        html += '<div class="day-counter">بحث کنید و مافیا رو پیدا کنید!</div>';
      } else if (phase === 'voting') {
        html += '<div class="phase-indicator phase-voting">🗳 رأی‌گیری</div>';
        html += '<div class="day-counter">به کی رأی می‌دید؟</div>';
      }
      html += '</div>';

      // کارت نقش (فقط بعد از شروع)
      if (myRole) {
        html += renderRoleCard(myRole);
      }

      // لیست بازیکن‌ها
      html += '<h3 style="font-size:0.95rem; margin-bottom:8px;">👥 بازیکن‌ها (' + players.filter(function(p) { return p.is_alive; }).length + ' زنده)</h3>';
      html += '<div class="players-grid">';
      players.forEach(function(p) {
        var isMe = p.user_id === currentUser.id;
        var name = p.profiles ? p.profiles.username : 'ناشناس';
        var cls = 'player-item' + (isMe ? ' me' : '') + (p.is_alive ? '' : ' dead');
        html += '<div class="' + cls + '"><span>' + name + (isMe ? ' (شما)' : '') + '</span><span>' + (p.is_alive ? '❤️' : '💀') + '</span></div>';
      });
      html += '</div>';

      // کنترل‌های میزبان
      var isHost = gameState.host_id === currentUser.id;
      if (isHost) {
        html += renderHostControls(phase, players);
      }

      // عملیات شب
      if (phase === 'night' && myPlayerInfo.is_alive) {
        html += renderNightActions(myRole, players);
      }

      // رأی‌گیری
      if (phase === 'voting' && myPlayerInfo.is_alive) {
        html += renderVoting(players);
      }

      // چت
      html += renderChat();

      content.innerHTML = html;
      bindEvents(players);
      loadMessages();
    }

    function renderRoleCard(role) {
      var names = { mafia: '🕵️ مافیا', doctor: '💊 دکتر', detective: '🔍 کارآگاه', citizen: '👤 شهروند' };
      var descs = {
        mafia: 'شب‌ها یکی رو می‌کشی. روزها خودت رو بی‌گناه نشون بده!',
        doctor: 'شب‌ها یکی رو نجات می‌ده. اگه مافیا همون رو بزنه، نمرده!',
        detective: 'شب‌ها یکی رو تحقیق کن. می‌فهمی مافیا هست یا نه.',
        citizen: 'شب کاری نداری، ولی رأی تو سرنوشت‌سازه!'
      };
      return '<div class="role-card"><h3>نقش تو: ' + names[role] + '</h3><p>' + descs[role] + '</p></div>';
    }

    function renderHostControls(phase, players) {
      var html = '<div class="host-controls"><h3>🛠 کنترل میزبان</h3>';
      if (phase === 'lobby') {
        var aliveCount = players.length;
        if (aliveCount >= 7) {
          html += '<button onclick="startGame()">🚀 شروع بازی</button>';
        } else {
          html += '<p style="font-size:0.85rem; color:#aaa;">حداقل ۷ نفر لازمه (الان ' + aliveCount + ' نفر)</p>';
        }
      } else if (phase === 'night') {
        html += '<button onclick="resolveNight()">☀️ بیدار کردن شهر</button>';
      } else if (phase === 'day') {
        html += '<button onclick="startVoting()">🗳 شروع رأی‌گیری</button>';
      } else if (phase === 'voting') {
        html += '<button onclick="resolveVotes()">📊 شمارش رأی‌ها</button>';
      }
      html += '</div>';
      return html;
    }

    function renderNightActions(role, players) {
      var aliveOthers = players.filter(function(p) { return p.is_alive && p.user_id !== currentUser.id; });
      
      if (role === 'mafia') {
        var html = '<div class="action-box"><h3>🕵️ انتخاب قربانی (فقط مافیا)</h3>';
        aliveOthers.forEach(function(p) {
          html += '<button class="action-btn" data-target="' + p.user_id + '">' + p.profiles.username + '</button>';
        });
        html += '</div>';
        return html;
      }
      
      if (role === 'doctor') {
        var html = '<div class="action-box"><h3>💊 انتخاب برای نجات</h3>';
        players.filter(function(p) { return p.is_alive; }).forEach(function(p) {
          html += '<button class="action-btn" data-target="' + p.user_id + '">' + p.profiles.username + '</button>';
        });
        html += '</div>';
        return html;
      }
      
      if (role === 'detective') {
        var html = '<div class="action-box"><h3>🔍 انتخاب برای تحقیق</h3>';
        aliveOthers.forEach(function(p) {
          html += '<button class="action-btn" data-target="' + p.user_id + '">' + p.profiles.username + '</button>';
        });
        html += '</div>';
        return html;
      }
      
      return '';
    }

    function renderVoting(players) {
      var aliveOthers = players.filter(function(p) { return p.is_alive && p.user_id !== currentUser.id; });
      var html = '<div class="action-box"><h3>🗳 به کی رأی می‌دی؟</h3>';
      aliveOthers.forEach(function(p) {
        html += '<button class="action-btn vote-btn" data-target="' + p.user_id + '">' + p.profiles.username + '</button>';
      });
      html += '<button class="action-btn" style="background:var(--border); color:var(--text); margin-top:10px;" onclick="submitVote(null)">🚫 رأی نمی‌دم</button>';
      html += '</div>';
      return html;
    }

    function renderChat() {
      return '<div class="chat-box"><div class="chat-messages" id="chatMessages"><p class="system-msg">در حال بارگذاری...</p></div><div class="chat-input"><input id="chatInput" placeholder="پیامت رو بنویس..."><button onclick="sendMessage()">ارسال</button></div></div>';
    }

    function renderFinished(content, players) {
      var mafiaWon = gameState.winner === 'mafia';
      var html = '<div class="winner-box">';
      html += '<h2>' + (mafiaWon ? '🕵️ مافیا برنده شد!' : '👥 شهروندها برنده شدن!') + '</h2>';
      html += '<p style="color:var(--text-dim); font-size:0.9rem; margin-bottom:16px;">نقش‌ها:</p>';
      html += '<div style="text-align:right; max-width:300px; margin:0 auto;">';
      players.forEach(function(p) {
        var roleNames = { mafia: '🕵️', doctor: '💊', detective: '🔍', citizen: '👤' };
        html += '<div style="padding:6px 0; border-bottom:1px dashed var(--border); display:flex; justify-content:space-between;"><span>' + p.profiles.username + '</span><span>' + (roleNames[p.role] || '?') + '</span></div>';
      });
      html += '</div>';
      html += '<a href="mafia.html" class="btn btn-green btn-full" style="margin-top:20px; display:inline-block; text-decoration:none; padding:12px 20px;">🔙 بازگشت به لیست بازی‌ها</a>';
      html += '</div>';
      content.innerHTML = html;
    }

    function bindEvents(players) {
      // کلیک روی دکمه‌های شب
      document.querySelectorAll('.action-btn[data-target]').forEach(function(btn) {
        btn.addEventListener('click', function() {
          document.querySelectorAll('.action-btn[data-target]').forEach(function(b) { b.classList.remove('selected'); });
          btn.classList.add('selected');
          selectedTarget = btn.getAttribute('data-target');
          
          var action = myRole === 'mafia' ? 'kill' : (myRole === 'doctor' ? 'save' : 'investigate');
          submitNightAction(action, selectedTarget);
        });
      });

      // کلیک روی دکمه‌های رأی
      document.querySelectorAll('.vote-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          submitVote(btn.getAttribute('data-target'));
        });
      });
    }

    function submitNightAction(action, targetId) {
      supabaseClient.from('mafia_night_actions').insert({
        game_id: parseInt(gameId),
        actor_id: currentUser.id,
        target_id: targetId,
        action: action,
        day_number: gameState.day_number
      }).then(function(res) {
        if (res.error) { alert('خطا: ' + res.error.message); return; }
        alert('انتخاب شما ثبت شد');
      });
    }

    function submitVote(targetId) {
      if (!targetId) {
        alert('رأی نمی‌دی، اوکیه');
        return;
      }
      supabaseClient.from('mafia_votes').upsert({
        game_id: parseInt(gameId),
        voter_id: currentUser.id,
        target_id: targetId,
        day_number: gameState.day_number
      }, { onConflict: 'game_id,voter_id,day_number' }).then(function(res) {
        if (res.error) { alert('خطا: ' + res.error.message); return; }
        alert('رأی شما ثبت شد');
      });
    }

    // ارسال پیام
    function sendMessage() {
      var input = document.getElementById('chatInput');
      var text = input.value.trim();
      if (!text) return;

      // فیلتر کلمات
      var cleaned = text.replace(/[\/\-\.\_\s]/g, '');
      for (var i = 0; i < bannedWords.length; i++) {
        if (cleaned.includes(bannedWords[i])) {
          alert('پیامت حاوی کلمات نامناسب بود');
          return;
        }
      }

      var channel = (gameState.phase === 'night' && myRole === 'mafia') ? 'mafia' : 'public';
      
      // در شب فقط مافیا چت می‌کنه (با هم‌تیمی‌هاش)
      if (gameState.phase === 'night' && myRole !== 'mafia') {
        alert('در شب فقط مافیا می‌تونه چت کنه');
        return;
      }

      input.value = '';
      supabaseClient.from('mafia_messages').insert({
        game_id: parseInt(gameId),
        user_id: currentUser.id,
        message: text,
        channel: channel,
        day_number: gameState.day_number
      });
    }

    function loadMessages() {
      var channel = 'public';
      if (gameState.phase === 'night' && myRole === 'mafia') {
        channel = 'mafia';
      }

      supabaseClient.from('mafia_messages')
        .select('*, profiles(username)')
        .eq('game_id', gameId)
        .eq('channel', channel)
        .order('created_at', { ascending: true })
        .then(function(res) {
          var box = document.getElementById('chatMessages');
          if (!box) return;
          var rows = res.data || [];
          
          if (rows.length === 0) {
            box.innerHTML = '<p class="system-msg">هنوز پیامی نیست</p>';
            return;
          }
          
          box.innerHTML = '';
          rows.forEach(function(m) {
            var isMe = m.user_id === currentUser.id;
            var cls = 'chat-msg ' + (isMe ? 'me' : 'other') + (m.channel === 'mafia' ? ' mafia' : '');
            var div = document.createElement('div');
            div.className = cls;
            if (!isMe) {
              div.innerHTML = '<div class="msg-name">' + m.profiles.username + '</div>' + m.message;
            } else {
              div.textContent = m.message;
            }
            box.appendChild(div);
          });
          box.scrollTop = box.scrollHeight;
        });
    }

    // ===== عملکردهای میزبان =====
    window.startGame = function() {
      supabaseClient.from('mafia_players').select('*').eq('game_id', gameId).then(function(res) {
        var players = res.data || [];
        if (players.length < 7) { alert('حداقل ۷ نفر لازمه'); return; }

        // تعیین تعداد مافیا
        var mafiaCount = players.length <= 8 ? 2 : (players.length <= 11 ? 2 : 3);
        var roles = [];
        for (var i = 0; i < mafiaCount; i++) roles.push('mafia');
        roles.push('doctor');
        roles.push('detective');
        while (roles.length < players.length) roles.push('citizen');

        // شافل کردن
        for (var i = roles.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var tmp = roles[i]; roles[i] = roles[j]; roles[j] = tmp;
        }

        // اختصاص نقش‌ها
        var promises = players.map(function(p, idx) {
          return supabaseClient.from('mafia_players').update({ role: roles[idx] }).eq('id', p.id);
        });

        Promise.all(promises).then(function() {
          supabaseClient.from('mafia_games').update({
            status: 'playing',
            phase: 'night',
            day_number: 1
          }).eq('id', gameId).then(function() {
            alert('بازی شروع شد! نقش‌ها پخش شدن.');
            loadGame();
          });
        });
      });
    };

    window.resolveNight = function() {
      // جمع‌آوری اقدامات شب
      supabaseClient.from('mafia_night_actions').select('*').eq('game_id', gameId).eq('day_number', gameState.day_number).then(function(res) {
        var actions = res.data || [];
        var kill = actions.find(function(a) { return a.action === 'kill'; });
        var save = actions.find(function(a) { return a.action === 'save'; });
        var investigate = actions.find(function(a) { return a.action === 'investigate'; });

        var victimId = kill ? kill.target_id : null;
        if (kill && save && kill.target_id === save.target_id) {
          victimId = null; // نجات پیدا کرد
        }

        // اجرای کشتن
        var updates = [];
        if (victimId) {
          updates.push(supabaseClient.from('mafia_players').update({ is_alive: false }).eq('game_id', gameId).eq('user_id', victimId));
        }

        Promise.all(updates).then(function() {
          // اگه کارآگاه تحقیق کرده بود، پیام مخفی براش
          if (investigate) {
            supabaseClient.from('mafia_players').select('role').eq('game_id', gameId).eq('user_id', investigate.target_id).single().then(function(tr) {
              var targetRole = tr.data ? tr.data.role : '?';
              var isMafia = targetRole === 'mafia';
              supabaseClient.from('mafia_messages').insert({
                game_id: parseInt(gameId),
                user_id: investigate.actor_id,
                message: '[نتیجه‌ی تحقیق: ' + (isMafia ? 'مافیا هست!' : 'مافیا نیست') + ']',
                channel: 'private_' + investigate.actor_id,
                day_number: gameState.day_number
              });
            });
          }

          // چک کردن شرط برد
          checkWinCondition().then(function(finished) {
            if (finished) return;

            supabaseClient.from('mafia_games').update({ phase: 'day' }).eq('id', gameId).then(function() {
              loadGame();
            });
          });
        });
      });
    };

    window.startVoting = function() {
      supabaseClient.from('mafia_games').update({ phase: 'voting' }).eq('id', gameId).then(function() {
        loadGame();
      });
    };

    window.resolveVotes = function() {
      supabaseClient.from('mafia_votes').select('*').eq('game_id', gameId).eq('day_number', gameState.day_number).then(function(res) {
        var votes = res.data || [];
        var counts = {};
        votes.forEach(function(v) {
          counts[v.target_id] = (counts[v.target_id] || 0) + 1;
        });

        var maxVotes = 0;
        var lynchedId = null;
        Object.keys(counts).forEach(function(id) {
          if (counts[id] > maxVotes) { maxVotes = counts[id]; lynchedId = id; }
        });

        // اگه مساوی بود، کسی حذف نمی‌شه
        var tied = Object.values(counts).filter(function(v) { return v === maxVotes; }).length > 1;
        if (tied) lynchedId = null;

        var promises = [];
        if (lynchedId) {
          promises.push(supabaseClient.from('mafia_players').update({ is_alive: false }).eq('game_id', gameId).eq('user_id', lynchedId));
        }

        Promise.all(promises).then(function() {
          checkWinCondition().then(function(finished) {
            if (finished) return;
            supabaseClient.from('mafia_games').update({
              phase: 'night',
              day_number: gameState.day_number + 1
            }).eq('id', gameId).then(function() {
              loadGame();
            });
          });
        });
      });
    };

    function checkWinCondition() {
      return supabaseClient.from('mafia_players').select('*').eq('game_id', gameId).then(function(res) {
        var players = res.data || [];
        var aliveMafia = players.filter(function(p) { return p.is_alive && p.role === 'mafia'; }).length;
        var aliveOthers = players.filter(function(p) { return p.is_alive && p.role !== 'mafia'; }).length;

        var winner = null;
        if (aliveMafia === 0) winner = 'citizens';
        else if (aliveMafia >= aliveOthers) winner = 'mafia';

        if (winner) {
          return supabaseClient.from('mafia_games').update({ status: 'finished', phase: 'finished', winner: winner }).eq('id', gameId).then(function() {
            return true;
          });
        }
        return false;
      });
    }
  </script>
</body>
