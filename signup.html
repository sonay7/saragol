<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ثبت‌نام | مدرسه‌ی ما</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="logo">مدرسه‌ی ما</div>
  </header>

  <main class="container">

    <section class="profile-card">
      <h2 class="profile-name">ثبت‌نام</h2>
      <p class="profile-class">اطلاعاتت رو وارد کن</p>
    </section>

    <section>
      <label class="label">اسم کاربری</label>
      <input id="username" type="text" class="input" placeholder="مثلاً ali71">

      <label class="label" style="margin-top: 12px;">کلاس</label>
      <select id="class" class="select">
        <option value="هفتم ۱">هفتم ۱</option>
        <option value="هفتم ۲">هفتم ۲</option>
        <option value="هفتم ۳">هفتم ۳</option>
        <option value="هفتم ۴">هفتم ۴</option>
        <option value="هفتم ۵">هفتم ۵</option>
        <option value="هشتم ۱">هشتم ۱</option>
        <option value="هشتم ۲">هشتم ۲</option>
        <option value="هشتم ۳">هشتم ۳</option>
        <option value="هشتم ۴">هشتم ۴</option>
        <option value="هشتم ۵">هشتم ۵</option>
        <option value="نهم ۱">نهم ۱</option>
        <option value="نهم ۲">نهم ۲</option>
        <option value="نهم ۳">نهم ۳</option>
        <option value="نهم ۴">نهم ۴</option>
      </select>

      <label class="label" style="margin-top: 12px;">رمز</label>
      <input id="password" type="password" class="input" placeholder="حداقل ۶ کاراکتر">

      <button id="signupBtn" class="btn btn-green btn-full" style="margin-top: 16px;">ثبت‌نام</button>

      <p id="signupMsg" style="margin-top: 12px; text-align: center; font-size: 0.85rem;"></p>

      <p style="margin-top: 16px; text-align: center; font-size: 0.85rem; color: var(--text-dim);">
        قبلاً ثبت‌نام کردی؟ <a href="login.html" style="color: var(--green);">وارد شو</a>
      </p>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
    <script src="theme.js"></script>
  <script src="signup.js"></script>
</body>
</html>
