<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل مشاور | مدرسه‌ی ما</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* استایل اختصاصی برای شبیه شدن به پیام‌رسان */
    .messenger-layout {
      display: flex;
      gap: 16px;
      height: calc(100vh - 160px);
      min-height: 500px;
    }
    @media (max-width: 768px) {
      .messenger-layout { flex-direction: column; height: auto; }
      .sidebar { max-height: 300px; }
      .chat-area { height: 400px; }
    }
    .sidebar {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .chat-area {
      flex: 2;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .chat-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(46, 204, 113, 0.05);
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .chat-input-area {
      padding: 12px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
    }
    .student-item {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.2s;
    }
    .student-item:hover { background: rgba(255, 255, 255, 0.05); }
    .student-item.active { background: rgba(46, 204, 113, 0.1); border-right: 3px solid var(--green); }
    
    /* نشان قرمز پیام جدید */
    .unread-badge {
      background: #e74c3c;
      color: white;
      border-radius: 12px;
      padding: 2px 8px;
      font-size: 0.75rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="logo">پنل مشاور</div>
    <div class="user-area">
      <span class="user-name">—</span>
      <div class="avatar">—</div>
    </div>
  </header>

  <main class="container">
    <h2>💬 پیام‌های مشاوره</h2>

    <div class="messenger-layout">
      <!-- ستون لیست دانش‌آموزان -->
      <div class="sidebar" id="studentsList">
        <p class="lock-note" style="text-align: center; margin-top: 20px;">در حال بارگذاری...</p>
      </div>

      <!-- صفحه چت -->
      <div class="chat-area" id="chatSection">
        <div class="chat-header" id="chatHeader">
          <h3 id="chatWithName">یه نفر رو از لیست انتخاب کن</h3>
          <button id="markReadBtn" class="btn btn-dim btn-sm hidden">علامت‌گذاری خوانده‌شده</button>
        </div>
        
        <div class="chat-messages" id="chatBox">
          <p class="lock-note" style="text-align: center; margin-top: 20px;">چتی انتخاب نشده</p>
        </div>

        <div class="chat-input-area" id="chatInputArea" style="display: none;">
          <input id="msgInput" type="text" class="input" placeholder="جوابت رو بنویس..." style="flex: 1;">
          <button id="sendBtn" class="btn btn-green">ارسال</button>
        </div>
      </div>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">🏠 خانه</a>
    <a href="study.html" class="nav-item">⏱ مطالعه</a>
    <a href="books.html" class="nav-item">📚 کتاب‌خوانی</a>
    <a href="counselor-panel.html" class="nav-item active">💬 پنل مشاور</a>
    <a href="profile.html" class="nav-item">👤 پروفایل</a>
  </nav>

  <!-- اسکریپت‌ها (دقت کن که theme.js اضافه شده و ورژن js هم آپدیت شده) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="auth.js"></script>
  <script src="theme.js"></script>
  <script src="counselor-panel.js?v=3"></script>
</body>
</html>
