<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فروشگاه | ساراگل</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .shop-tabs { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0; margin-bottom: 20px; scrollbar-width: none; }
    .shop-tab { background: var(--bg-card); color: var(--text-dim); border: 1px solid var(--border); padding: 8px 16px; border-radius: 20px; font-family: inherit; cursor: pointer; white-space: nowrap; }
    .shop-tab.active { background: var(--green); color: #fff; border-color: var(--green); font-weight: bold; }
    
    .shop-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding-bottom: 80px; }
    .shop-card { position: relative; background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 12px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
    
    .shop-icon { font-size: 3rem; margin-bottom: 10px; }
    .shop-img { width: 100%; height: 100px; border-radius: 10px; object-fit: cover; margin-bottom: 10px; border: 1px solid var(--border); }
    .shop-name { font-size: 0.9rem; font-weight: bold; margin-bottom: 4px; color: var(--text); }
    .shop-desc { font-size: 0.7rem; color: var(--text-dim); margin-bottom: 12px; min-height: 30px; }
    .shop-price { color: #f1c40f; font-weight: bold; font-size: 0.85rem; margin-bottom: 10px; }
    
    .buy-btn { background: var(--green); color: #fff; border: none; padding: 10px; border-radius: 10px; width: 100%; font-family: inherit; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-bought { background: #444 !important; color: #888 !important; cursor: not-allowed !important; }
    .equip-btn { background: var(--blue); color: #fff; border: none; padding: 8px; border-radius: 10px; width: 100%; font-family: inherit; font-weight: bold; cursor: pointer; margin-top: 6px; font-size: 0.8rem; }

    /* دکمه‌های ادمین */
    .admin-actions { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; z-index: 10; }
    .edit-btn, .delete-btn { background: #e74c3c; color: white; border: none; border-radius: 50%; width: 26px; height: 26px; font-size: 12px; cursor: pointer; display: flex; justify-content: center; align-items: center; }
    .edit-btn { background: #f39c12; }
    
    .admin-fab { position: fixed; bottom: 90px; left: 20px; width: 60px; height: 60px; background: var(--green); color: #fff; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 2rem; box-shadow: 0 4px 15px rgba(0,0,0,0.3); cursor: pointer; z-index: 100; border: none; }
    .admin-fab:hover { transform: scale(1.1); }

    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
    .modal.hidden { display: none; }
    .modal-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto; }
  </style>
</head>
<body>

<header class="header">
  <div class="logo">ساراگل</div>
  <div class="user-area">
    <span id="myXp" style="color:#f1c40f; font-weight:bold; font-size:0.9rem;">... XP</span>
    <div class="avatar">—</div>
  </div>
</header>

<main class="container">
  <h2 style="text-align:center; margin-bottom:20px;">🛒 فروشگاه ساراگل</h2>
  
  <div class="shop-tabs" id="shopTabs">
    <button class="shop-tab active" data-cat="avatar">👤 عکس پروفایل</button>
    <button class="shop-tab" data-cat="theme">🎨 تم‌ها</button>
    <button class="shop-tab" data-cat="font">🖋️ فونت‌ها</button>
    <button class="shop-tab" data-cat="mafia">🕵️ مافیا</button>
    <button class="shop-tab" data-cat="chat">💬 چت و استیکر</button>
  </div>

  <div class="shop-grid" id="itemsGrid"></div>
</main>

<button class="admin-fab hidden" id="adminFab" onclick="openAddItemModal()">+</button>

<!-- مودال اضافه کردن / ویرایش آیتم -->
<div id="addItemModal" class="modal hidden">
  <div class="modal-box">
    <h3 id="modalTitle" style="margin-bottom: 12px;">➕ افزودن آیتم جدید</h3>
    <input id="addName" class="input" placeholder="نام آیتم (الزامی)" style="margin-bottom: 8px;">
    
    <select id="addCategory" class="input" style="margin-bottom: 8px;">
      <option value="avatar">عکس پروفایل</option>
      <option value="theme">تم</option>
      <option value="font">فونت</option>
      <option value="mafia">مافیا</option>
      <option value="chat">چت (آیتم معمولی)</option>
    </select>
    
    <input id="addPrice" type="number" class="input" placeholder="قیمت (XP) - الزامی" style="margin-bottom: 8px;">
    
    <div style="background: rgba(52, 152, 219, 0.1); padding: 10px; border-radius: 10px; margin-bottom: 8px; border: 1px solid var(--blue);">
      <p style="font-size: 0.8rem; margin-bottom: 6px; color: var(--blue); font-weight: bold;">فقط برای تم و فونت:</p>
      <input id="addEffectValue" class="input" placeholder="مقدار افکت (مثلاً sakura یا Tahoma)" style="margin-bottom: 0;">
    </div>

    <div style="background: var(--bg); padding: 10px; border-radius: 10px; margin-bottom: 8px; border: 1px dashed var(--border);">
      <p style="font-size: 0.8rem; margin-bottom: 6px; color: var(--text-dim);">انتخاب تصویر (اختیاری):</p>
      <label style="font-size: 0.85rem; display: block; margin-bottom: 6px;">
        📁 از گالری عکس انتخاب کن:
        <input id="addImageFile" type="file" accept="image/*" class="input" style="margin-top: 4px; padding: 6px;">
      </label>
      <p style="font-size: 0.75rem; color: var(--text-dim); text-align: center; margin: 4px 0;">یا</p>
      <label style="font-size: 0.85rem; display: block;">
        😀 یه ایموجی تایپ کن:
        <input id="addEmoji" type="text" class="input" placeholder="مثلاً 🎨" style="margin-top: 4px;">
      </label>
    </div>

    <input id="addDesc" class="input" placeholder="توضیحات (اختیاری)" style="margin-bottom: 12px;">
    
    <button id="saveItemBtn" class="btn btn-green btn-full" onclick="submitItem()">ذخیره</button>
    <button class="btn btn-dim btn-full" style="margin-top: 8px;" onclick="closeModal()">انصراف</button>
  </div>
</div>

<nav class="bottom-nav">
  <a href="index.html" class="nav-item">🏠 خانه</a>
  <a href="study.html" class="nav-item">⏱ مطالعه</a>
  <a href="gift.html" class="nav-item">🎁 هدیه</a>
  <a href="shop.html" class="nav-item active">🛒 فروشگاه</a>
  <a href="profile.html" class="nav-item">👤 پروفایل</a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="auth.js"></script>
<script src="theme.js"></script>

<script>
  var currentUser = null;
  var myXp = 0;
  var isAdmin = false;
  var currentCategory = 'avatar';
  var editingItemId = null;
  var isBuying = false;

  supabaseClient.auth.getUser().then(res => {
    if (!res.data.user) { window.location.href = 'login.html'; return; }
    currentUser = res.data.user;
    
    supabaseClient.from('profiles').select('xp, role').eq('id', currentUser.id).single().then(p => {
      myXp = p.data.xp || 0;
      document.getElementById('myXp').textContent = myXp + ' XP';
      
      if (p.data.role === 'admin' || p.data.role === 'superadmin') {
        isAdmin = true;
        document.getElementById('adminFab').classList.remove('hidden');
      }
      
      loadTab('avatar');
    });
  });

  document.querySelectorAll('.shop-tab').forEach(tab => {
    tab.addEventListener('click', function() {
      document.querySelectorAll('.shop-tab').forEach(t => t.classList.remove('active'));
      this.classList.add('active');
      currentCategory = this.getAttribute('data-cat');
      loadTab(currentCategory);
    });
  });

  function loadTab(category) {
    var grid = document.getElementById('itemsGrid');
    grid.innerHTML = '<p class="lock-note" style="grid-column: span 2;">در حال بارگذاری...</p>';
    
    // ⬇️ اگر تب چت بود، هم آیتم‌های معمولی و هم پک‌های استیکر رو لود کن ⬇️
    if (category === 'chat') {
      loadChatAndStickers();
      return;
    }
    
    // بقیه تب‌ها (عکس، تم، فونت، مافیا)
    supabaseClient.from('user_inventory').select('item_id').eq('user_id', currentUser.id).then(invRes => {
      var boughtIds = (invRes.data || []).map(i => String(i.item_id));
      
      supabaseClient.from('shop_items').select('*').eq('category', category).eq('is_active', true).then(res => {
        grid.innerHTML = '';
        if (!res.data || res.data.length === 0) {
          grid.innerHTML = '<p class="lock-note" style="grid-column: span 2;">آیتمی در این دسته وجود ندارد.</p>';
          return;
        }
        
        res.data.forEach(item => {
          var isBought = boughtIds.includes(String(item.id));
          var canAfford = myXp >= item.price;
          
          var btnHtml = '';
          
          if (isBought) {
            btnHtml = `<button class="buy-btn btn-bought" disabled>خریداری شده</button>`;
            if (category === 'theme' || category === 'font') {
              btnHtml += `<button class="equip-btn" onclick="applyItem('${category}', '${item.effect_value}')">✨ استفاده</button>`;
            }
          } else {
            var btnDisabled = canAfford ? '' : 'disabled';
            btnHtml = `<button class="buy-btn" ${btnDisabled} onclick="buyItem('${item.id}', ${item.price}, '${category}', '${item.name}')">خرید</button>`;
          }

          var adminBtns = isAdmin ? `
            <div class="admin-actions">
              <button class="edit-btn" onclick='openEditModal(${JSON.stringify(item).replace(/'/g, "&#39;")})'>✏️</button>
              <button class="delete-btn" onclick="deleteItem('${item.id}')">×</button>
            </div>
          ` : '';
          
          var mediaHtml = item.image_url 
            ? `<img src="${item.image_url}" class="shop-img" alt="${item.name}">` 
            : `<div class="shop-icon">${item.icon || '📦'}</div>`;

          var div = document.createElement('div');
          div.className = 'shop-card';
          div.innerHTML = `
            ${adminBtns}
            <div style="width: 100%;">
              ${mediaHtml}
              <div class="shop-name">${item.name}</div>
              <div class="shop-desc">${item.description || ''}</div>
            </div>
            <div style="width:100%;">
              <div class="shop-price">${item.price} XP</div>
              ${btnHtml}
            </div>
          `;
          grid.appendChild(div);
        });
      });
    });
  }

  // ===== تابع اختصاصی برای تب چت (ترکیب آیتم‌های چت و پک‌های استیکر) =====
  function loadChatAndStickers() {
    var grid = document.getElementById('itemsGrid');
    
    Promise.all([
      supabaseClient.from('shop_items').select('*').eq('category', 'chat').eq('is_active', true),
      supabaseClient.from('sticker_packs').select('*, stickers(id)').eq('is_active', true),
      supabaseClient.from('user_inventory').select('item_id').eq('user_id', currentUser.id)
    ]).then(results => {
      var chatItems = results[0].data || [];
      var stickerPacks = results[1].data || [];
      var boughtIds = (results[2].data || []).map(i => String(i.item_id));
      
      grid.innerHTML = '';
      
      if (chatItems.length === 0 && stickerPacks.length === 0) {
        grid.innerHTML = '<p class="lock-note" style="grid-column: span 2;">آیتمی در این دسته وجود ندارد.</p>';
        return;
      }

      // ۱. رندر کردن آیتم‌های معمولی چت (مثل هایلایت)
      chatItems.forEach(item => {
        var isBought = boughtIds.includes(String(item.id));
        var canAfford = myXp >= item.price;
        
        var btnHtml = isBought 
          ? `<button class="buy-btn btn-bought" disabled>خریداری شده</button>`
          : `<button class="buy-btn" ${canAfford ? '' : 'disabled'} onclick="buyItem('${item.id}', ${item.price}, 'chat', '${item.name}')">خرید</button>`;

        var adminBtns = isAdmin ? `
          <div class="admin-actions">
            <button class="edit-btn" onclick='openEditModal(${JSON.stringify(item).replace(/'/g, "&#39;")})'>✏️</button>
            <button class="delete-btn" onclick="deleteItem('${item.id}')">×</button>
          </div>
        ` : '';
        
        var mediaHtml = item.image_url 
          ? `<img src="${item.image_url}" class="shop-img" alt="${item.name}">` 
          : `<div class="shop-icon">${item.icon || '✨'}</div>`;

        var div = document.createElement('div');
        div.className = 'shop-card';
        div.innerHTML = `
          ${adminBtns}
          <div style="width: 100%;">
            ${mediaHtml}
            <div class="shop-name">${item.name}</div>
            <div class="shop-desc">${item.description || ''}</div>
          </div>
          <div style="width:100%;">
            <div class="shop-price">${item.price} XP</div>
            ${btnHtml}
          </div>
        `;
        grid.appendChild(div);
      });

      // ۲. رندر کردن پک‌های استیکر
      stickerPacks.forEach(pack => {
        var isBought = boughtIds.includes(String(pack.id));
        var canAfford = myXp >= pack.price;
        var stickerCount = pack.stickers ? pack.stickers.length : 0;

        var btnHtml = isBought 
          ? `<button class="buy-btn btn-bought" disabled>خریداری شده</button>`
          : `<button class="buy-btn" ${canAfford ? '' : 'disabled'} onclick="buyStickerPack('${pack.id}', ${pack.price}, '${pack.name}')">خرید</button>`;

        var div = document.createElement('div');
        div.className = 'shop-card';
        div.innerHTML = `
          <div style="width: 100%;">
            <div class="shop-icon">${pack.icon}</div>
            <div class="shop-name">${pack.name}</div>
            <div class="shop-desc">${stickerCount} استیکر</div>
          </div>
          <div style="width:100%;">
            <div class="shop-price">${pack.price} XP</div>
            ${btnHtml}
          </div>
        `;
        grid.appendChild(div);
      });
    });
  }

  // ===== خرید آیتم‌های معمولی =====
  window.buyItem = function(itemId, price, type, name) {
    if (isBuying) return;
    isBuying = true;

    supabaseClient.from('user_inventory').select('id').eq('user_id', currentUser.id).eq('item_id', itemId).then(checkRes => {
      if (checkRes.data && checkRes.data.length > 0) {
        alert('شما قبلاً این آیتم را خریده‌اید! صفحه بروزرسانی می‌شود.');
        isBuying = false;
        location.reload();
        return;
      }

      if (myXp < price) { alert('XP کافی نداری!'); isBuying = false; return; }
      if (!confirm('آیا ' + price + ' XP برای خرید ' + name + ' پرداخت می‌کنی؟')) { isBuying = false; return; }

      supabaseClient.from('profiles').update({ xp: myXp - price }).eq('id', currentUser.id).then(updateRes => {
        if (updateRes.error) { alert('خطا در کم کردن XP'); isBuying = false; return; }
        
        supabaseClient.from('user_inventory').insert({
          user_id: currentUser.id, item_type: type, item_id: itemId
        }).then(insertRes => {
          isBuying = false;
          
          if (insertRes.error) {
            alert('خطا در ثبت خرید: ' + insertRes.error.message);
            supabaseClient.from('profiles').update({ xp: myXp }).eq('id', currentUser.id);
            return;
          }
          
          alert('🎉 خرید با موفقیت انجام شد!');
          location.reload();
        });
      });
    });
  };

  // ===== خرید پک استیکر =====
  window.buyStickerPack = function(packId, price, name) {
    if (isBuying) return;
    isBuying = true;

    supabaseClient.from('user_inventory').select('id').eq('user_id', currentUser.id).eq('item_id', packId).then(checkRes => {
      if (checkRes.data && checkRes.data.length > 0) {
        alert('شما قبلاً این پک را خریده‌اید!');
        isBuying = false;
        location.reload();
        return;
      }

      if (myXp < price) { alert('XP کافی نداری!'); isBuying = false; return; }
      if (!confirm('آیا ' + price + ' XP برای خرید پک «' + name + '» پرداخت می‌کنی؟')) { isBuying = false; return; }

      supabaseClient.from('profiles').update({ xp: myXp - price }).eq('id', currentUser.id).then(updateRes => {
        if (updateRes.error) { alert('خطا در کم کردن XP'); isBuying = false; return; }
        
        supabaseClient.from('user_inventory').insert({
          user_id: currentUser.id, item_type: 'sticker', item_id: packId
        }).then(insertRes => {
          isBuying = false;
          
          if (insertRes.error) {
            alert('خطا در ثبت خرید: ' + insertRes.error.message);
            supabaseClient.from('profiles').update({ xp: myXp }).eq('id', currentUser.id);
            return;
          }
          
          alert('🎉 پک استیکر با موفقیت خریداری شد! حالا می‌تونی توی چت ازش استفاده کنی.');
          location.reload();
        });
      });
    });
  };

  // ===== استفاده از تم و فونت =====
  window.applyItem = function(type, effectValue) {
    if (!effectValue || effectValue.trim() === '') { 
      alert('❌ این آیتم مقدار افکت ندارد! ادمین باید مقدار را تنظیم کند.'); 
      return; 
    }
    
    if (type === 'theme') {
      document.documentElement.setAttribute('data-theme', effectValue);
      localStorage.setItem('site-theme', effectValue);
      alert('🎨 تم سایت با موفقیت تغییر کرد!');
    } else if (type === 'font') {
      document.body.style.fontFamily = effectValue;
      localStorage.setItem('site-font', effectValue);
      alert('🖋️ فونت سایت با موفقیت تغییر کرد!');
    }
  };

  // ===== توابع ادمین =====
  window.openAddItemModal = function() {
    editingItemId = null;
    document.getElementById('modalTitle').textContent = '➕ افزودن آیتم جدید';
    document.getElementById('addName').value = '';
    document.getElementById('addPrice').value = '';
    document.getElementById('addEffectValue').value = '';
    document.getElementById('addEmoji').value = '';
    document.getElementById('addDesc').value = '';
    document.getElementById('addImageFile').value = '';
    document.getElementById('addItemModal').classList.remove('hidden');
  };

  window.openEditModal = function(item) {
    editingItemId = item.id;
    document.getElementById('modalTitle').textContent = '✏️ ویرایش آیتم';
    document.getElementById('addName').value = item.name;
    document.getElementById('addCategory').value = item.category;
    document.getElementById('addPrice').value = item.price;
    document.getElementById('addEffectValue').value = item.effect_value || '';
    document.getElementById('addEmoji').value = item.icon || '';
    document.getElementById('addDesc').value = item.description || '';
    document.getElementById('addImageFile').value = '';
    document.getElementById('addItemModal').classList.remove('hidden');
  };

  window.closeModal = function() { document.getElementById('addItemModal').classList.add('hidden'); };

  window.deleteItem = function(id) {
    if (!confirm('مطمئنی می‌خوای این آیتم رو حذف کنی؟')) return;
    supabaseClient.from('shop_items').delete().eq('id', id).select().then(res => {
      if (res.error) { alert('خطا: ' + res.error.message); return; }
      if (!res.data || res.data.length === 0) { alert('❌ دیتابیس اجازه حذف نداد!'); return; }
      loadTab(currentCategory);
    });
  };

  window.submitItem = async function() {
    var name = document.getElementById('addName').value.trim();
    var cat = document.getElementById('addCategory').value;
    var price = parseInt(document.getElementById('addPrice').value);
    var effectVal = document.getElementById('addEffectValue').value.trim();
    var emoji = document.getElementById('addEmoji').value.trim();
    var desc = document.getElementById('addDesc').value.trim();
    var file = document.getElementById('addImageFile').files[0];
    var btn = document.getElementById('saveItemBtn');

    if (!name || !price || price < 1) { alert('نام و قیمت رو درست وارد کن'); return; }

    btn.disabled = true;
    btn.textContent = 'در حال ذخیره...';
    var imageUrl = null;

    if (file) {
      var fileName = 'shop_' + Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9.]/g, '');
      var uploadRes = await supabaseClient.storage.from('videos').upload(fileName, file);
      if (uploadRes.error) { alert('خطا در آپلود: ' + uploadRes.error.message); btn.disabled = false; btn.textContent = 'ذخیره'; return; }
      imageUrl = supabaseClient.storage.from('videos').getPublicUrl(fileName).data.publicUrl;
    }

    var itemData = {
      name: name,
      category: cat,
      price: price,
      icon: emoji || '📦',
      description: desc,
      effect_value: effectVal || null
    };

    if (imageUrl) itemData.image_url = imageUrl;

    var query;
    if (editingItemId) {
      query = supabaseClient.from('shop_items').update(itemData).eq('id', editingItemId);
    } else {
      if (!file && !emoji) { alert('یا یه عکس انتخاب کن یا یه ایموجی بنویس!'); btn.disabled = false; btn.textContent = 'ذخیره'; return; }
      query = supabaseClient.from('shop_items').insert(itemData);
    }

    query.then(res => {
      btn.disabled = false;
      btn.textContent = 'ذخیره';
      if (res.error) { alert('خطا: ' + res.error.message); return; }
      
      closeModal();
      alert(editingItemId ? '✅ آیتم ویرایش شد!' : '✅ آیتم اضافه شد!');
      editingItemId = null;
      
      document.querySelectorAll('.shop-tab').forEach(t => {
        if (t.getAttribute('data-cat') === cat) t.click();
      });
    });
  };
</script>
</body>
</html>
